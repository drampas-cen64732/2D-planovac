<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Návrh Pozemku a Domu</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Postranní panel */
        #sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background-color: #f1f5f9;
        }

        .panel-header h1 {
            font-size: 1.2rem;
            margin: 0 0 5px 0;
            color: #0f172a;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #64748b;
            margin: 0;
        }

        .panel-content {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        h2 {
            font-size: 0.7rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        /* Tlačítka — jednotný design systém */
        .btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 9px 12px;
            margin-bottom: 6px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-family: inherit;
            color: var(--text);
            transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
            gap: 10px;
            text-align: left;
            box-sizing: border-box;
        }

        .btn:focus {
            outline: 2px solid #93c5fd;
            outline-offset: 1px;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: #f1f5f9;
            flex-shrink: 0;
            font-size: 1.05rem;
            transition: background 0.15s ease;
        }

        .btn-content {
            flex: 1;
            min-width: 0;
            line-height: 1.2;
        }

        .btn-label {
            font-weight: 500;
            color: #0f172a;
            font-size: 0.875rem;
        }

        .btn-meta {
            font-size: 0.72rem;
            color: #64748b;
            margin-top: 2px;
        }

        .btn:hover {
            border-color: #93c5fd;
            background: #f8fafc;
        }

        .btn:hover .btn-icon {
            background: #dbeafe;
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn-primary {
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
            border-color: #1d4ed8;
            box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
        }

        .btn-primary .btn-icon {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-primary .btn-label {
            color: white;
            font-weight: 600;
        }

        .btn-primary .btn-meta {
            color: rgba(255, 255, 255, 0.85);
        }

        .btn-primary:hover {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            border-color: #1d4ed8;
        }

        .btn-primary:hover .btn-icon {
            background: rgba(255, 255, 255, 0.28);
        }

        .btn-danger {
            background: white;
            border-color: #fecaca;
        }

        .btn-danger .btn-icon {
            background: #fee2e2;
        }

        .btn-danger .btn-label {
            color: #dc2626;
        }

        .btn-danger:hover {
            background: #fef2f2;
            border-color: #fca5a5;
        }

        .btn-danger:hover .btn-icon {
            background: #fecaca;
        }

        .section {
            margin-bottom: 22px;
        }

        .section-divider {
            height: 1px;
            background-color: var(--border);
            margin: 18px 0;
        }

        /* Pracovní plocha */
        #workspace {
            flex-grow: 1;
            position: relative;
            background-color: #e2e8f0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
            background-size: 20px 20px; /* 1 metr = 20px */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        .canvas-container {
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background-color: white;
        }

        /* Skryté inputy */
        #import-input {
            display: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="panel-header">
            <h1>Návrh Pozemku</h1>
            <p>1 dílek mřížky = 1 metr</p>
        </div>
        
        <div class="panel-content">
            <div class="section">
                <h2>Hlavní budova</h2>
                <button class="btn btn-primary" onclick="addHouse()">
                    <span class="btn-icon">🏠</span>
                    <div class="btn-content">
                        <div class="btn-label">Dům Blanka 36</div>
                        <div class="btn-meta">9.7 × 7.9 m — detailní půdorys</div>
                    </div>
                </button>
            </div>

            <div class="section">
                <h2>Další typy domů</h2>
                <button class="btn" onclick="addShape('bungalow_classic')">
                    <span class="btn-icon">🏘️</span>
                    <div class="btn-content">
                        <div class="btn-label">Klasický bungalov</div>
                        <div class="btn-meta">12 × 9 m (108 m²)</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('bungalow_l')">
                    <span class="btn-icon">🏡</span>
                    <div class="btn-content">
                        <div class="btn-label">Bungalov do L</div>
                        <div class="btn-meta">cca 140 m² (zastavěná plocha)</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('house_wide')">
                    <span class="btn-icon">🏤</span>
                    <div class="btn-content">
                        <div class="btn-label">Delší a širší dům</div>
                        <div class="btn-meta">14 × 9 m (126 m²)</div>
                    </div>
                </button>
            </div>

            <div class="section">
                <h2>Stavby a zpevněné plochy</h2>
                <button class="btn" onclick="addShape('carport')">
                    <span class="btn-icon">🚗</span>
                    <div class="btn-content">
                        <div class="btn-label">Dvojitý přístřešek</div>
                        <div class="btn-meta">6 × 6 m</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('gardenHouse')">
                    <span class="btn-icon">🛖</span>
                    <div class="btn-content">
                        <div class="btn-label">Zahradní domek</div>
                        <div class="btn-meta">5 × 3 m</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('terrace')">
                    <span class="btn-icon">🪵</span>
                    <div class="btn-content">
                        <div class="btn-label">Terasa</div>
                        <div class="btn-meta">6 × 4 m</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('driveway')">
                    <span class="btn-icon">🛣️</span>
                    <div class="btn-content">
                        <div class="btn-label">Příjezdová cesta</div>
                        <div class="btn-meta">5 × 3 m</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('stonePath')">
                    <span class="btn-icon">🪨</span>
                    <div class="btn-content">
                        <div class="btn-label">Kamenitá cesta (dlažba)</div>
                        <div class="btn-meta">6 × 1 m — dlažební kameny</div>
                    </div>
                </button>
            </div>

            <div class="section">
                <h2>Zahrada a volný čas</h2>
                <button class="btn" onclick="addShape('pool')">
                    <span class="btn-icon">🏊</span>
                    <div class="btn-content">
                        <div class="btn-label">Bazén</div>
                        <div class="btn-meta">6 × 3 m</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('firepit')">
                    <span class="btn-icon">🔥</span>
                    <div class="btn-content">
                        <div class="btn-label">Ohniště</div>
                        <div class="btn-meta">Ø 1.5 m</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('tree')">
                    <span class="btn-icon">🌳</span>
                    <div class="btn-content">
                        <div class="btn-label">Strom</div>
                        <div class="btn-meta">Ø 3 m — koruna</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('greenery')">
                    <span class="btn-icon">🌷</span>
                    <div class="btn-content">
                        <div class="btn-label">Okrasná zeleň</div>
                        <div class="btn-meta">3 × 2 m</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('flowerBed')">
                    <span class="btn-icon">🌱</span>
                    <div class="btn-content">
                        <div class="btn-label">Záhon</div>
                        <div class="btn-meta">3 × 1 m — hnědý se zelení</div>
                    </div>
                </button>
            </div>

            <div class="section">
                <h2>Posezení a relax</h2>
                <button class="btn" onclick="addShape('outdoorSeating')">
                    <span class="btn-icon">🍽️</span>
                    <div class="btn-content">
                        <div class="btn-label">Venkovní posezení</div>
                        <div class="btn-meta">Stůl + 6 židlí</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('loungeZone')">
                    <span class="btn-icon">🛋️</span>
                    <div class="btn-content">
                        <div class="btn-label">Klidová zóna</div>
                        <div class="btn-meta">Gauč + 2 křesla</div>
                    </div>
                </button>
            </div>

            <div class="section">
                <h2>Popelnice</h2>
                <button class="btn" onclick="addShape('bin_black')">
                    <span class="btn-icon">⚫</span>
                    <div class="btn-content">
                        <div class="btn-label">Popelnice — směsný odpad</div>
                        <div class="btn-meta">Černá (0.6 × 0.7 m)</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('bin_yellow')">
                    <span class="btn-icon">🟡</span>
                    <div class="btn-content">
                        <div class="btn-label">Popelnice — plast</div>
                        <div class="btn-meta">Žlutá (0.6 × 0.7 m)</div>
                    </div>
                </button>
                <button class="btn" onclick="addShape('bin_blue')">
                    <span class="btn-icon">🔵</span>
                    <div class="btn-content">
                        <div class="btn-label">Popelnice — papír</div>
                        <div class="btn-meta">Modrá (0.6 × 0.7 m)</div>
                    </div>
                </button>
            </div>

            <div class="section">
                <h2>Vlastní rozměry</h2>
                <button class="btn" onclick="addCustomShape()">
                    <span class="btn-icon">📐</span>
                    <div class="btn-content">
                        <div class="btn-label">Vlastní obdélník</div>
                        <div class="btn-meta">Zadej rozměry v metrech</div>
                    </div>
                </button>
            </div>

            <div class="section-divider"></div>

            <div class="section">
                <h2>Nástroje</h2>
                <button class="btn btn-danger" onclick="deleteSelected()">
                    <span class="btn-icon">🗑️</span>
                    <div class="btn-content">
                        <div class="btn-label">Smazat vybrané</div>
                        <div class="btn-meta">Klávesa Delete / Backspace</div>
                    </div>
                </button>
            </div>

            <div class="section">
                <h2>Export / Import</h2>
                <button class="btn" onclick="exportPDF()">
                    <span class="btn-icon">📄</span>
                    <div class="btn-content">
                        <div class="btn-label">Stáhnout jako PDF</div>
                    </div>
                </button>
                <button class="btn" onclick="exportJSON()">
                    <span class="btn-icon">💾</span>
                    <div class="btn-content">
                        <div class="btn-label">Uložit návrh</div>
                        <div class="btn-meta">.json soubor</div>
                    </div>
                </button>
                <button class="btn" onclick="document.getElementById('import-input').click()">
                    <span class="btn-icon">📂</span>
                    <div class="btn-content">
                        <div class="btn-label">Načíst návrh</div>
                        <div class="btn-meta">.json soubor</div>
                    </div>
                </button>
                <input type="file" id="import-input" accept=".json" onchange="importJSON(event)">
            </div>
        </div>
    </div>

    <div id="workspace">
        <canvas id="c"></canvas>
    </div>

<script>
    // --- KONFIGURACE MĚŘÍTKA ---
    const PPM = 20; // 1 metr v reálu = 20 pixelů na plátně

    // Globální nastavení manipulace a rotace
    fabric.Object.prototype.transparentCorners = false;
    fabric.Object.prototype.cornerColor = '#2563eb';
    fabric.Object.prototype.cornerStyle = 'circle';
    fabric.Object.prototype.snapAngle = 90;      // Přitáhnout po 90 stupních
    fabric.Object.prototype.snapThreshold = 10;  // Tolerance pro přitažení

    const canvas = new fabric.Canvas('c', {
        width: 1000,
        height: 850,
        preserveObjectStacking: true
    });

    // --- 1. VYKRESLENÍ POZEMKU ---
    function drawPlot() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // Souřadnice hranic parcely
        const outerPoints = [
            { x: 0 * PPM, y: 0 * PPM },
            { x: 14.98 * PPM, y: 0 * PPM },
            { x: 20 * PPM, y: 2.05 * PPM },
            { x: 20 * PPM, y: 34.63 * PPM },
            { x: 0 * PPM, y: 34.63 * PPM }
        ];

        // Souřadnice vnitřní stavitelné zóny
        // Pozn.: jižní strana (dole) sousedí s obecní silnicí, takže tam šrafování není potřeba
        // → spodní hrana inner zóny = spodní hrana pozemku (y = 34.63), ale 2 m odstup zleva i zprava zachován
        const innerPoints = [
            { x: 2 * PPM, y: 2 * PPM },
            { x: 14.58 * PPM, y: 2 * PPM },
            { x: 18 * PPM, y: 3.39 * PPM },
            { x: 18 * PPM, y: 34.63 * PPM },
            { x: 2 * PPM, y: 34.63 * PPM }
        ];

        // Vytvoření šrafovacího vzoru (červené linky)
        const hatchCanvas = document.createElement('canvas');
        hatchCanvas.width = 12;
        hatchCanvas.height = 12;
        const hctx = hatchCanvas.getContext('2d');
        hctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        hctx.lineWidth = 1.5;
        hctx.beginPath();
        hctx.moveTo(0, 12);
        hctx.lineTo(12, 0);
        hctx.stroke();

        const hatchPattern = new fabric.Pattern({
            source: hatchCanvas,
            repeat: 'repeat'
        });

        // 1. Vrstva: Šrafování (2m hranice)
        const outerHatch = new fabric.Polygon(outerPoints, {
            left: centerX, top: centerY,
            originX: 'center', originY: 'center',
            fill: hatchPattern, stroke: '#ef4444', strokeWidth: 1,
            selectable: false, evented: false
        });

        // 2. Vrstva: Stavební část (zelená tráva)
        const innerPlot = new fabric.Polygon(innerPoints, {
            left: centerX, top: centerY,
            originX: 'center', originY: 'center',
            fill: '#e2f0d9', stroke: '#7e9c65', strokeWidth: 1.5,
            selectable: false, evented: false
        });

        // Přidání textu s výměrou doprostřed
        const text = new fabric.Text("Pozemek 250/25\nRozloha: 680.6 m²\n(Šrafování = 2m hranice; jih = silnice)", {
            left: centerX, top: centerY,
            fontSize: 15,
            fill: '#557041',
            textAlign: 'center',
            originX: 'center', originY: 'center',
            selectable: false, evented: false
        });

        canvas.add(outerHatch);
        canvas.add(innerPlot);
        canvas.add(text);
        
        canvas.sendToBack(text);
        canvas.sendToBack(innerPlot);
        canvas.sendToBack(outerHatch);
    }

    drawPlot();

    // --- 2. VLOŽENÍ DOMU ---
    function addHouse() {
        const houseWidth = 9.7 * PPM;
        const houseHeight = 7.9 * PPM;
        const elements = [];

        // Základová deska
        elements.push(new fabric.Rect({
            left: 0, top: 0, width: houseWidth, height: houseHeight,
            fill: '#ffffff', stroke: '#333333', strokeWidth: 3
        }));

        // Obývák + Kuchyně
        elements.push(new fabric.Rect({
            left: 5, top: 5, width: 85, height: 148,
            fill: '#fff0db', stroke: '#888', strokeWidth: 1
        }));
        elements.push(new fabric.Text("Obývák +\nKuchyně", {
            left: 47, top: 79, fontSize: 11, textAlign: 'center', originX: 'center', originY: 'center', fill: '#555'
        }));

        // Schodiště
        elements.push(new fabric.Rect({
            left: 95, top: 5, width: 35, height: 45,
            fill: '#e5e7eb', stroke: '#888', strokeWidth: 1
        }));
        for(let i=10; i<45; i+=5) {
            elements.push(new fabric.Line([95, i, 130, i], { stroke: '#9ca3af', strokeWidth: 1 }));
        }

        // Pokoj
        elements.push(new fabric.Rect({
            left: 135, top: 5, width: 54, height: 70,
            fill: '#fff0db', stroke: '#888', strokeWidth: 1
        }));
        elements.push(new fabric.Text("Pokoj", {
            left: 162, top: 40, fontSize: 11, textAlign: 'center', originX: 'center', originY: 'center', fill: '#555'
        }));

        // Koupelna
        elements.push(new fabric.Rect({
            left: 135, top: 80, width: 54, height: 35,
            fill: '#e0f2fe', stroke: '#888', strokeWidth: 1
        }));
        elements.push(new fabric.Text("Koupelna", {
            left: 162, top: 97, fontSize: 10, textAlign: 'center', originX: 'center', originY: 'center', fill: '#555'
        }));

        // Tech. místnost
        elements.push(new fabric.Rect({
            left: 135, top: 120, width: 54, height: 33,
            fill: '#f1f5f9', stroke: '#888', strokeWidth: 1
        }));
        elements.push(new fabric.Text("Tech.", {
            left: 162, top: 136, fontSize: 10, textAlign: 'center', originX: 'center', originY: 'center', fill: '#555'
        }));

        // Chodba
        elements.push(new fabric.Rect({
            left: 95, top: 55, width: 35, height: 98,
            fill: '#fafaf9', stroke: '#888', strokeWidth: 1
        }));
        
        // Vchodová šipka
        elements.push(new fabric.Triangle({
            left: 112, top: houseHeight + 10, width: 15, height: 15,
            fill: 'black', angle: 180, originX: 'center', originY: 'center'
        }));

        const houseGroup = new fabric.Group(elements, {
            left: canvas.width / 2, top: canvas.height / 2,
            originX: 'center', originY: 'center',
            lockScalingX: true, lockScalingY: true,
            hasBorders: true, hasControls: true
        });

        houseGroup.setControlsVisibility({
            mt: false, mb: false, ml: false, mr: false,
            tl: false, tr: false, bl: false, br: false,
            mtr: true 
        });

        canvas.add(houseGroup);
        canvas.setActiveObject(houseGroup);
    }

    // --- 3. KNIHOVNA OBJEKTŮ ---
    // Pomocná funkce: vytvoří fabric.Group ze sady prvků a vloží na střed plátna
    function placeGroup(elements, opts = {}) {
        const group = new fabric.Group(elements, {
            left: canvas.width / 2,
            top: canvas.height / 2,
            originX: 'center',
            originY: 'center',
            hasControls: true,
            transparentCorners: false,
            ...opts
        });
        canvas.add(group);
        canvas.setActiveObject(group);
        return group;
    }

    // Helper: nakreslí "střechu shora" — obdélníková sedlová střecha s hřebenem a okapy
    // Použito u jednoduchých typů domů.
    function buildRoofRect(widthM, heightM, color = '#9ca3af', ridgeColor = '#475569') {
        const w = widthM * PPM;
        const h = heightM * PPM;
        const items = [];

        // Hlavní obrys (půdorys střechy)
        items.push(new fabric.Rect({
            left: -w/2, top: -h/2, width: w, height: h,
            fill: color, stroke: '#374151', strokeWidth: 1.5
        }));

        // Hřeben (uprostřed po delší straně)
        if (widthM >= heightM) {
            items.push(new fabric.Line([-w/2, 0, w/2, 0], {
                stroke: ridgeColor, strokeWidth: 2
            }));
            // Okapy / štíty (diagonály z rohů ke hřebeni)
            items.push(new fabric.Line([-w/2, -h/2, -w/2 + h/2, 0], { stroke: '#6b7280', strokeWidth: 1 }));
            items.push(new fabric.Line([-w/2,  h/2, -w/2 + h/2, 0], { stroke: '#6b7280', strokeWidth: 1 }));
            items.push(new fabric.Line([ w/2, -h/2,  w/2 - h/2, 0], { stroke: '#6b7280', strokeWidth: 1 }));
            items.push(new fabric.Line([ w/2,  h/2,  w/2 - h/2, 0], { stroke: '#6b7280', strokeWidth: 1 }));
        } else {
            items.push(new fabric.Line([0, -h/2, 0, h/2], {
                stroke: ridgeColor, strokeWidth: 2
            }));
            items.push(new fabric.Line([-w/2, -h/2, 0, -h/2 + w/2], { stroke: '#6b7280', strokeWidth: 1 }));
            items.push(new fabric.Line([ w/2, -h/2, 0, -h/2 + w/2], { stroke: '#6b7280', strokeWidth: 1 }));
            items.push(new fabric.Line([-w/2,  h/2, 0,  h/2 - w/2], { stroke: '#6b7280', strokeWidth: 1 }));
            items.push(new fabric.Line([ w/2,  h/2, 0,  h/2 - w/2], { stroke: '#6b7280', strokeWidth: 1 }));
        }

        return items;
    }

    function addShape(type) {
        const defaultOptions = {
            left: 0, top: 0,
            originX: 'center', originY: 'center',
            opacity: 0.92,
            strokeWidth: 1
        };

        // Objekty s detailním vlastním designem (více prvků ve skupině) — bez popisku
        if (type === 'tree') {
            // Strom: hnědý kmen + zelená koruna se zubatým okrajem
            const r = (3 * PPM) / 2;
            const items = [];
            // Vnější koruna - několik překrývajících se zelených kruhů
            for (let i = 0; i < 7; i++) {
                const angle = (i / 7) * Math.PI * 2;
                const cx = Math.cos(angle) * r * 0.45;
                const cy = Math.sin(angle) * r * 0.45;
                items.push(new fabric.Circle({
                    left: cx, top: cy,
                    radius: r * 0.55,
                    fill: '#86efac',
                    stroke: '#16a34a',
                    strokeWidth: 0.8,
                    opacity: 0.85,
                    originX: 'center', originY: 'center'
                }));
            }
            // Vnitřní (tmavší) koruna pro hloubku
            items.push(new fabric.Circle({
                left: 0, top: 0,
                radius: r * 0.65,
                fill: '#4ade80',
                stroke: '#15803d',
                strokeWidth: 0.8,
                opacity: 0.85,
                originX: 'center', originY: 'center'
            }));
            // Kmen uprostřed (hnědé kolečko)
            items.push(new fabric.Circle({
                left: 0, top: 0,
                radius: r * 0.18,
                fill: '#92400e',
                stroke: '#451a03',
                strokeWidth: 1,
                originX: 'center', originY: 'center'
            }));
            placeGroup(items);
            return;
        }

        if (type === 'flowerBed') {
            // Záhon: hnědý obdélník + 6 zelených koleček (rostliny)
            const w = 3 * PPM;
            const h = 1 * PPM;
            const items = [];
            items.push(new fabric.Rect({
                left: -w/2, top: -h/2, width: w, height: h,
                fill: '#92400e', stroke: '#451a03', strokeWidth: 1.5,
                rx: 2, ry: 2
            }));
            // Rostlinky v 2 řadách x 3 sloupce
            const cols = 6, rows = 1;
            for (let i = 0; i < cols; i++) {
                const px = -w/2 + (w / (cols + 1)) * (i + 1);
                items.push(new fabric.Circle({
                    left: px, top: 0,
                    radius: PPM * 0.22,
                    fill: '#4ade80',
                    stroke: '#15803d',
                    strokeWidth: 0.6,
                    originX: 'center', originY: 'center'
                }));
            }
            placeGroup(items);
            return;
        }

        if (type === 'stonePath') {
            // Kamenitá cesta — nepravidelné kameny (dlažba)
            const w = 6 * PPM;
            const h = 1 * PPM;
            const items = [];
            // Podklad
            items.push(new fabric.Rect({
                left: -w/2, top: -h/2, width: w, height: h,
                fill: '#a8a29e', stroke: '#57534e', strokeWidth: 1
            }));
            // Jednotlivé kameny — náhodné polygony
            const stoneCount = 14;
            for (let i = 0; i < stoneCount; i++) {
                const cx = -w/2 + (w / stoneCount) * (i + 0.5) + (Math.random() - 0.5) * 4;
                const cy = (Math.random() - 0.5) * h * 0.4;
                const sw = PPM * (0.35 + Math.random() * 0.2);
                const sh = PPM * (0.35 + Math.random() * 0.2);
                items.push(new fabric.Rect({
                    left: cx, top: cy,
                    width: sw, height: sh,
                    fill: '#d6d3d1',
                    stroke: '#78716c',
                    strokeWidth: 0.6,
                    rx: 3, ry: 3,
                    angle: Math.random() * 30 - 15,
                    originX: 'center', originY: 'center'
                }));
            }
            placeGroup(items);
            return;
        }

        if (type === 'driveway') {
            // Příjezdová cesta — světle šedý beton se spárami
            const w = 5 * PPM;
            const h = 3 * PPM;
            const items = [];
            items.push(new fabric.Rect({
                left: -w/2, top: -h/2, width: w, height: h,
                fill: '#d1d5db', stroke: '#6b7280', strokeWidth: 1.2
            }));
            // Dilatační spáry
            items.push(new fabric.Line([-w/6, -h/2, -w/6, h/2], { stroke: '#9ca3af', strokeWidth: 0.8 }));
            items.push(new fabric.Line([ w/6, -h/2,  w/6, h/2], { stroke: '#9ca3af', strokeWidth: 0.8 }));
            items.push(new fabric.Line([-w/2, 0, w/2, 0], { stroke: '#9ca3af', strokeWidth: 0.8 }));
            placeGroup(items);
            return;
        }

        if (type === 'outdoorSeating') {
            // Stůl + 6 židlí (bez obdélníkového ohraničení)
            const items = [];
            const tableW = 1.8 * PPM;
            const tableH = 0.9 * PPM;
            // Stůl
            items.push(new fabric.Rect({
                left: -tableW/2, top: -tableH/2,
                width: tableW, height: tableH,
                fill: '#a16207', stroke: '#451a03', strokeWidth: 1.2,
                rx: 3, ry: 3
            }));
            // 6 židlí — 3 nahoře, 3 dole
            const chairSize = PPM * 0.45;
            for (let i = 0; i < 3; i++) {
                const cx = -tableW/2 + (tableW / 4) * (i + 1);
                // horní řada
                items.push(new fabric.Rect({
                    left: cx, top: -tableH/2 - chairSize/2 - 4,
                    width: chairSize, height: chairSize,
                    fill: '#78350f', stroke: '#451a03', strokeWidth: 0.8,
                    rx: 2, ry: 2,
                    originX: 'center', originY: 'center'
                }));
                // dolní řada
                items.push(new fabric.Rect({
                    left: cx, top: tableH/2 + chairSize/2 + 4,
                    width: chairSize, height: chairSize,
                    fill: '#78350f', stroke: '#451a03', strokeWidth: 0.8,
                    rx: 2, ry: 2,
                    originX: 'center', originY: 'center'
                }));
            }
            placeGroup(items);
            return;
        }

        if (type === 'loungeZone') {
            // Klidová zóna — gauč + 2 křesla (bez obdélníku okolo)
            const items = [];
            const sofaW = 2.2 * PPM;
            const sofaH = 0.8 * PPM;
            // Gauč
            items.push(new fabric.Rect({
                left: 0, top: 0,
                width: sofaW, height: sofaH,
                fill: '#64748b', stroke: '#1e293b', strokeWidth: 1.2,
                rx: 4, ry: 4,
                originX: 'center', originY: 'center'
            }));
            // Polštáře na gauči
            for (let i = 0; i < 3; i++) {
                items.push(new fabric.Rect({
                    left: -sofaW/2 + (sofaW / 3) * (i + 0.5),
                    top: 0,
                    width: sofaW / 3.5, height: sofaH * 0.7,
                    fill: '#94a3b8', stroke: '#475569', strokeWidth: 0.6,
                    rx: 2, ry: 2,
                    originX: 'center', originY: 'center'
                }));
            }
            // Levé křeslo
            const armW = 0.9 * PPM;
            const armH = 0.9 * PPM;
            items.push(new fabric.Rect({
                left: -sofaW/2 - armW/2 - 6,
                top: 0,
                width: armW, height: armH,
                fill: '#64748b', stroke: '#1e293b', strokeWidth: 1.2,
                rx: 4, ry: 4,
                originX: 'center', originY: 'center'
            }));
            // Pravé křeslo
            items.push(new fabric.Rect({
                left: sofaW/2 + armW/2 + 6,
                top: 0,
                width: armW, height: armH,
                fill: '#64748b', stroke: '#1e293b', strokeWidth: 1.2,
                rx: 4, ry: 4,
                originX: 'center', originY: 'center'
            }));
            placeGroup(items);
            return;
        }

        if (type === 'firepit') {
            // Ohniště — kámen + plamen
            const items = [];
            const r = 1.5 * PPM / 2;
            // Vnější kruh kamenů (šedý)
            items.push(new fabric.Circle({
                left: 0, top: 0,
                radius: r,
                fill: '#78716c', stroke: '#44403c', strokeWidth: 1.5,
                originX: 'center', originY: 'center'
            }));
            // Vnitřek (tmavší — popel)
            items.push(new fabric.Circle({
                left: 0, top: 0,
                radius: r * 0.65,
                fill: '#1c1917', stroke: '#44403c', strokeWidth: 0.8,
                originX: 'center', originY: 'center'
            }));
            // Plamen — oranžový kruh
            items.push(new fabric.Circle({
                left: 0, top: 0,
                radius: r * 0.35,
                fill: '#f97316', stroke: '#dc2626', strokeWidth: 0.8,
                opacity: 0.9,
                originX: 'center', originY: 'center'
            }));
            placeGroup(items);
            return;
        }

        if (type === 'bin_black' || type === 'bin_yellow' || type === 'bin_blue') {
            // Popelnice — barevné, malý obdélník s víkem
            const colorMap = {
                bin_black:  { body: '#27272a', lid: '#18181b' },
                bin_yellow: { body: '#facc15', lid: '#ca8a04' },
                bin_blue:   { body: '#2563eb', lid: '#1e40af' }
            };
            const c = colorMap[type];
            const w = 0.6 * PPM;
            const h = 0.7 * PPM;
            const items = [];
            // Tělo
            items.push(new fabric.Rect({
                left: -w/2, top: -h/2 + 2,
                width: w, height: h - 2,
                fill: c.body, stroke: '#0f172a', strokeWidth: 1,
                rx: 1, ry: 1
            }));
            // Víko
            items.push(new fabric.Rect({
                left: -w/2 - 1, top: -h/2,
                width: w + 2, height: 3,
                fill: c.lid, stroke: '#0f172a', strokeWidth: 1
            }));
            placeGroup(items);
            return;
        }

        if (type === 'bungalow_classic') {
            // Klasický bungalov 12×9 m — sedlová střecha shora
            placeGroup([
                ...buildRoofRect(12, 9, '#a16207', '#451a03'),
                new fabric.Text("Bungalov\n12×9 m", {
                    left: 0, top: 0, fontSize: 11, textAlign: 'center',
                    fill: '#1e293b', fontWeight: 'bold',
                    originX: 'center', originY: 'center',
                    backgroundColor: 'rgba(255,255,255,0.6)'
                })
            ]);
            return;
        }

        if (type === 'house_wide') {
            // Delší širší dům 14×9 m
            placeGroup([
                ...buildRoofRect(14, 9, '#7c2d12', '#3f1c0c'),
                new fabric.Text("Dům\n14×9 m", {
                    left: 0, top: 0, fontSize: 11, textAlign: 'center',
                    fill: '#1e293b', fontWeight: 'bold',
                    originX: 'center', originY: 'center',
                    backgroundColor: 'rgba(255,255,255,0.6)'
                })
            ]);
            return;
        }

        if (type === 'bungalow_l') {
            // Bungalov do L (~140 m²): hlavní 12×8 + přístavek 6×6
            const items = [];
            const mainW = 12 * PPM, mainH = 8 * PPM;
            const wingW = 6 * PPM, wingH = 6 * PPM;
            // L-tvar jako polygon: hlavní obdélník + přístavek vpravo dole
            const lPoints = [
                { x: 0,           y: 0 },
                { x: mainW,       y: 0 },
                { x: mainW,       y: mainH },
                { x: mainW + wingW - mainW + (mainW - wingW), y: mainH }, // = wingW od levého kraje hlavního dílu
            ];
            // Jednodušeji vytvořím L jako 2 rect:
            items.length = 0;
            // Hlavní díl
            items.push(new fabric.Rect({
                left: -mainW/2, top: -mainH/2 - wingH/2,
                width: mainW, height: mainH,
                fill: '#a16207', stroke: '#451a03', strokeWidth: 1.5
            }));
            // Přístavek (pravý dolní)
            items.push(new fabric.Rect({
                left: mainW/2 - wingW, top: mainH/2 - wingH/2,
                width: wingW, height: wingH,
                fill: '#a16207', stroke: '#451a03', strokeWidth: 1.5
            }));
            // Hřebeny střech
            items.push(new fabric.Line([-mainW/2, -wingH/2, mainW/2, -wingH/2], {
                stroke: '#451a03', strokeWidth: 2
            }));
            items.push(new fabric.Line([mainW/2 - wingW/2, mainH/2 - wingH/2, mainW/2 - wingW/2, mainH/2 + wingH/2], {
                stroke: '#451a03', strokeWidth: 2
            }));
            // Popisek
            items.push(new fabric.Text("Bungalov L\n~140 m²", {
                left: -mainW/4, top: -wingH/2 + 2, fontSize: 11, textAlign: 'center',
                fill: '#1e293b', fontWeight: 'bold',
                originX: 'center', originY: 'center',
                backgroundColor: 'rgba(255,255,255,0.6)'
            }));
            placeGroup(items);
            return;
        }

        // --- Ostatní jednodušší objekty (s popiskem) ---
        let shape;
        switch(type) {
            case 'carport':
                shape = new fabric.Rect({ ...defaultOptions, width: 6 * PPM, height: 6 * PPM, fill: '#cbd5e1', stroke: '#475569' });
                break;
            case 'gardenHouse':
                shape = new fabric.Rect({ ...defaultOptions, width: 5 * PPM, height: 3 * PPM, fill: '#d4a373', stroke: '#8b5a2b' });
                break;
            case 'terrace':
                shape = new fabric.Rect({ ...defaultOptions, width: 6 * PPM, height: 4 * PPM, fill: '#fcd34d', stroke: '#b45309' });
                break;
            case 'pool':
                shape = new fabric.Rect({ ...defaultOptions, width: 6 * PPM, height: 3 * PPM, fill: '#7dd3fc', stroke: '#0284c7', rx: 5, ry: 5 });
                break;
            case 'greenery':
                shape = new fabric.Rect({ ...defaultOptions, width: 3 * PPM, height: 2 * PPM, fill: '#bbf7d0', stroke: '#22c55e', rx: 10, ry: 10 });
                break;
        }

        const textLabel = {
            'carport': 'Přístřešek\n(6x6m)',
            'gardenHouse': 'Zahr. domek\n(15m²)',
            'terrace': 'Terasa',
            'pool': 'Bazén',
            'greenery': 'Zeleň'
        };

        const text = new fabric.Text(textLabel[type] || '', {
            left: 0, top: 0,
            fontSize: 12,
            fontFamily: 'sans-serif',
            fill: '#000',
            textAlign: 'center',
            originX: 'center', originY: 'center'
        });

        placeGroup([shape, text]);
    }

    // --- 3b. VLASTNÍ ROZMĚRY ---
    function addCustomShape() {
        const wInput = prompt("Šířka v metrech (např. 6):", "6");
        if (wInput === null) return;
        const hInput = prompt("Výška / hloubka v metrech (např. 2):", "2");
        if (hInput === null) return;

        const wM = parseFloat(wInput.replace(',', '.'));
        const hM = parseFloat(hInput.replace(',', '.'));

        if (!isFinite(wM) || !isFinite(hM) || wM <= 0 || hM <= 0) {
            alert("Zadej kladná čísla pro šířku i výšku.");
            return;
        }

        const w = wM * PPM;
        const h = hM * PPM;
        const rect = new fabric.Rect({
            left: 0, top: 0, width: w, height: h,
            fill: '#fef3c7', stroke: '#b45309', strokeWidth: 1.5,
            originX: 'center', originY: 'center'
        });
        const label = new fabric.Text(`${wM} × ${hM} m`, {
            left: 0, top: 0, fontSize: 11,
            fill: '#1e293b', fontWeight: 'bold',
            textAlign: 'center',
            originX: 'center', originY: 'center'
        });
        placeGroup([rect, label]);
    }

    // --- 4. OVLÁDÁNÍ A MAZÁNÍ ---
    function deleteSelected() {
        const activeObject = canvas.getActiveObject();
        if (activeObject) {
            canvas.remove(activeObject);
            canvas.discardActiveObject();
        }
    }

    window.addEventListener('keydown', function(e) {
        if (e.key === 'Delete' || e.key === 'Backspace') {
            if (e.target.tagName !== 'INPUT') {
                deleteSelected();
                e.preventDefault();
            }
        }
    });

    canvas.on('mouse:down', function(options) {
        if(options.target && options.target.selectable) {
            options.target.bringToFront();
        }
    });

    // --- 5. EXPORT / IMPORT ---
    function exportJSON() {
        const json = canvas.toJSON();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(json));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", "navrh-pozemku.json");
        dlAnchorElem.click();
    }

    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(f) {
            const data = f.target.result;
            canvas.loadFromJSON(data, function() {
                canvas.renderAll();
                const objects = canvas.getObjects();
                // Ochrana vrstev pozemku (první 3 vrstvy)
                for(let i = 0; i < 3; i++) {
                    if(objects[i]) {
                        objects[i].set({selectable: false, evented: false});
                        canvas.sendToBack(objects[i]);
                    }
                }
            });
        };
        reader.readAsText(file);
    }

    // --- 6. EXPORT DO PDF ---
    function exportPDF() {
        canvas.discardActiveObject();
        canvas.renderAll();

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
            orientation: 'landscape',
            unit: 'px',
            format: [canvas.width, canvas.height]
        });

        const imgData = canvas.toDataURL({ format: 'jpeg', quality: 1.0 });
        doc.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
        doc.save('muj-navrh-pozemku.pdf');
    }

</script>
</body>
</html>
