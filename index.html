        let maxDD = 0;
        for (const v of values) {
          if (v > peak) peak = v;
          const dd = (v - peak) / peak;
          if (dd < maxDD) maxDD = dd;
        }
        const perf = (n) => {
          const idx = values.length - 1 - n;
          if (idx < 0) return 0;
          return annualisedReturn(values[idx], values[values.length - 1], n);
        };
        return {
          cagr,
          volatility,
          sharpe,
          maxDrawdown: maxDD * 100,
          totalReturn,
          performance1y: perf(12),
          performance3y: perf(36),
          performance5y: perf(60),
          finalValue,
        };
      }
      function allocationSum(a) {
        return Object.keys(a).reduce((s, k) => s + (a[k] || 0), 0);
      }
      function allocationEntries(a) {
        return Object.keys(a)
          .filter((k) => (a[k] || 0) > 0)

      /* ------------------------------------------------------------------ */
      const FX_CZK_TO_EUR = 0.04;
      const InvestmentContext = createContext(null);

      function InvestmentProvider({ children }) {
        const [currency, setCurrencyState] = useState("CZK");
        const [initialInvestment, setInitialInvestment] = useState(1_000_000);

        const setCurrency = (next) => {
          setCurrencyState((prev) => {
            if (prev === next) return prev;
            setInitialInvestment((amount) => {
              if (prev === "CZK" && next === "EUR")
                return Math.round(amount * FX_CZK_TO_EUR);
              if (prev === "EUR" && next === "CZK")
                return Math.round(amount / FX_CZK_TO_EUR);
              return amount;
            });
            return next;
          });
        };

        const value = useMemo(() => {
          const formatMoney = (amount, opts) => {
            const locale = currency === "CZK" ? "cs-CZ" : "de-DE";
            return new Intl.NumberFormat(locale, {
              style: "currency",
              currency,
              maximumFractionDigits: 0,
              notation: opts && opts.compact ? "compact" : "standard",
            }).format(amount);
          };
          return {
            currency,
            setCurrency,
            initialInvestment,
            setInitialInvestment,
            fxRate: FX_CZK_TO_EUR,
            formatMoney,
          };
        }, [currency, initialInvestment]);

        return (
          <InvestmentContext.Provider value={value}>
            {children}
          </InvestmentContext.Provider>
        );
      }
      function useInvestment() {
        const ctx = useContext(InvestmentContext);
        if (!ctx)
          throw new Error("useInvestment must be used within InvestmentProvider");
        return ctx;
      }

              step={1}
              value={value}
              onChange={(e) => onChange(clamp(Number(e.target.value)))}
              className="ep-slider"
              aria-label={"Slider — " + meta.label}
            />
          </div>
        );
      }

      function StatTile({ label, value, hint, tone }) {
        const toneClass =
          tone === "positive"
            ? "text-emerald-600"
            : tone === "negative"
            ? "text-rose-600"
            : "ep-text-navy";
        return (
          <div className="rounded-xl border border-slate-200 bg-slate-50 p-4">
            <div className="text-[10px] uppercase tracking-widest text-slate-500">
              {label}
            </div>
            <div className={"mt-1 text-xl font-bold tabular-nums " + toneClass}>
              {value}
            </div>
            {hint && (
              <div className="mt-1 text-[11px] text-slate-500">{hint}</div>
            )}
          </div>
        );
      }

      function CustomPortfolioBuilder() {
        const { initialInvestment, formatMoney } = useInvestment();
        const [allocation, setAllocation] = useState(DEFAULT_ALLOCATION);
        const [simulated, setSimulated] = useState(DEFAULT_ALLOCATION);

        const total = useMemo(() => allocationSum(allocation), [allocation]);
        const remaining = 100 - total;
        const valid = total === 100;

        const setWeight = (key, next) => {
          setAllocation((prev) => {
            const otherSum = Object.keys(prev)
              .filter((k) => k !== key)
              .reduce((s, k) => s + (prev[k] || 0), 0);
            const maxAllowed = Math.max(0, 100 - otherSum);
            const clamped = Math.min(next, maxAllowed);
            return { ...prev, [key]: clamped };
          });
        };
        const maxFor = (key) => {
          const otherSum = Object.keys(allocation)
            .filter((k) => k !== key)
            .reduce((s, k) => s + (allocation[k] || 0), 0);
          return Math.max(0, 100 - otherSum);
        };
        const resetAll = () => setAllocation(DEFAULT_ALLOCATION);
        const normalize = () => {
          if (total === 0) {
            setAllocation(DEFAULT_ALLOCATION);
            return;
          }
          setAllocation((prev) => {
            const next = {};
            const keys = Object.keys(prev);
            let running = 0;
            keys.forEach((k, idx) => {
              const v = prev[k] || 0;
              const scaled = Math.round((v / total) * 100);
              if (idx === keys.length - 1) next[k] = 100 - running;
              else {
                next[k] = scaled;
                running += scaled;
              }
            });
            return next;
          });
        };
        const runSimulation = () => {
          if (!valid) return;
          setSimulated({ ...allocation });
        };

        const stats = useMemo(
          () => (simulated ? computeStats(simulated, initialInvestment) : null),
          [simulated, initialInvestment]
        );

        return (
          <div className="space-y-6">
            <div className="grid gap-6 lg:grid-cols-[1.1fr_0.9fr]">
              <div className="space-y-3">
                {BUILDER_ASSETS.map((key) => (
                  <SliderRow
                    key={key}
                    assetKey={key}
                    value={allocation[key] || 0}
                    max={maxFor(key)}
                    onChange={(v) => setWeight(key, v)}
                  />
                ))}
              </div>

              <aside className="flex flex-col gap-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-premium">
                <div>
                  <div className="text-[10px] uppercase tracking-widest text-slate-500">
                    Celková alokace
                  </div>
                  <div className="mt-1 flex items-baseline gap-2">
                    <span
                      className={
                        "text-4xl font-bold tabular-nums " +
                        (valid
                          ? "text-emerald-600"
                          : total > 100
                          ? "text-rose-600"
                          : "ep-text-navy")
                      }
                    >
                      {total}
                    </span>
                    <span className="text-lg font-semibold text-slate-500">
                      / 100 %
                    </span>
                  </div>
                  <div className="mt-3 h-2 w-full overflow-hidden rounded-full bg-slate-100">
                    <div
                      className={
                        "h-full rounded-full transition-all " +
                        (valid
                          ? "bg-emerald-500"
                          : total > 100
                          ? "bg-rose-500"
                          : "bg-ep-blue-light")
                      }
                      style={{ width: Math.min(100, total) + "%" }}
                    />
                  </div>
                </div>

                {valid ? (
                  <div className="flex items-center gap-2 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-800">
                    <CheckCircle2Icon size={16} />
                    Alokace je vyvážená. Můžete spustit simulaci.
                  </div>
                ) : (
                  <div className="flex items-center gap-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800">
                    <AlertTriangleIcon size={16} />
                    {total < 100
                      ? "Pro spuštění simulace přidělte zbývajících " +
                        remaining +
                        " %."
                      : "Snižte alokaci o " + Math.abs(remaining) + " %."}
                  </div>
                )}

                <div className="flex flex-col gap-2">
                  <button
                    type="button"
                    onClick={runSimulation}
                    disabled={!valid}
                    className={
                      "inline-flex items-center justify-center gap-2 rounded-xl px-4 py-3 text-sm font-semibold transition-all " +
                      (valid
                        ? "bg-ep-navy text-white shadow-md hover:bg-ep-blue"
                        : "cursor-not-allowed bg-slate-100 text-slate-400")
                    }
                  >
                    <PlayCircleIcon size={16} />
                    Spustit simulaci vlastního portfolia
                  </button>

                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={normalize}
                      className="flex-1 inline-flex items-center justify-center gap-1.5 rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold ep-text-navy transition hover:border-ep-blue/40 hover:bg-slate-50"
                      title="Proporcionálně dorovnat na 100 %"
                    >
                      <ScaleIcon size={14} />
                      Dorovnat na 100 %
                    </button>
                    <button
                      type="button"
                      onClick={resetAll}
                      className="flex-1 inline-flex items-center justify-center gap-1.5 rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold ep-text-navy transition hover:border-ep-blue/40 hover:bg-slate-50"
                    >
                      <RotateCcwIcon size={14} />
                      Výchozí alokace
                    </button>
                  </div>
                </div>

                <div className="rounded-lg border border-slate-200 bg-slate-50 p-3 text-[11px] leading-relaxed text-slate-500">
                  <strong className="ep-text-navy">Upozornění:</strong> Modelace
                  vychází z hypotetických historických dat a slouží pouze pro
                  ilustraci. Minulé výnosy nejsou zárukou výnosů budoucích.
                </div>
              </aside>
            </div>

            {simulated && stats && (
              <div className="fade-in space-y-6">
                <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-premium md:p-7">
                  <div className="mb-4 flex flex-col gap-1 md:flex-row md:items-end md:justify-between">
                    <div>
                      <h3 className="text-lg font-semibold ep-text-navy md:text-xl">
                        Analytický report — Vlastní portfolio
                      </h3>
                      <p className="text-sm text-slate-500">
                        Vyhodnocení na základě měsíčních dat 2021 – Q1 2026.
                      </p>
                    </div>
                    <div className="text-right">
                      <div className="text-[10px] uppercase tracking-widest text-slate-500">
                        Konečná hodnota
                      </div>
                      <div className="text-xl font-bold ep-text-navy">
                        {formatMoney(stats.finalValue)}
                      </div>
                    </div>
                  </div>
                  <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                    <StatTile
                      label="Roční výnos (CAGR)"
                      value={stats.cagr.toFixed(2) + " %"}
                      tone={stats.cagr >= 0 ? "positive" : "negative"}
                      hint="Geometrický průměr za sledované období."
                    />
                    <StatTile
                      label="Volatilita (p.a.)"
                      value={stats.volatility.toFixed(2) + " %"}
                      hint="Realizovaná roční volatilita měsíčních výnosů."
                    />
                    <StatTile
                      label="Sharpe Ratio"
                      value={stats.sharpe.toFixed(2)}
                      tone={stats.sharpe >= 1 ? "positive" : "neutral"}
                      hint="Výnos nad bezrizikovou sazbu na jednotku rizika."
                    />
                    <StatTile
                      label="Max. Drawdown"
                      value={stats.maxDrawdown.toFixed(2) + " %"}
                      tone="negative"
                      hint="Největší pokles od vrcholu k dnu."
                    />
                  </div>
                </div>

                <PerformanceChart
                  allocation={simulated}
                  title="Modelace — Vlastní portfolio"
                  subtitle="Vážený průměr historických výnosů jednotlivých aktiv dle vaší alokace."
                />
              </div>
            )}
          </div>
        );
      }

      /* ------------------------------------------------------------------ */
      /*  CollapsibleSection + Index page                                    */
      /* ------------------------------------------------------------------ */
      function CollapsibleSection({
        title,
        description,
        icon,
        children,
        defaultOpen = false,
      }) {
        const [open, setOpen] = useState(defaultOpen);
        return (
          <section className="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-premium">
            <button
              type="button"
              onClick={() => setOpen((v) => !v)}
              aria-expanded={open}
              className="flex w-full items-center justify-between gap-4 px-5 py-4 text-left transition hover:bg-slate-50 md:px-7 md:py-5"
            >
              <div className="flex items-center gap-4">
                {icon && (
                  <div className="flex h-10 w-10 items-center justify-center rounded-lg border border-slate-200 bg-slate-50 ep-text-navy">
                    {icon}
                  </div>
                )}
                <div>
                  <h2 className="text-base font-semibold ep-text-navy md:text-lg">
                    {title}
                  </h2>
                  {description && (
                    <p className="text-xs text-slate-500 md:text-sm">
                      {description}
                    </p>
                  )}
                </div>
              </div>
              <ChevronDownIcon
                size={20}
                className={
                  "text-slate-500 transition-transform duration-300 " +
                  (open ? "rotate-180" : "")
                }
              />
            </button>
            <div
              className={
                "grid transition-all duration-300 ease-out " +
                (open
                  ? "grid-rows-[1fr] opacity-100"
                  : "grid-rows-[0fr] opacity-0")
              }
            >
              <div className="overflow-hidden">
                <div className="border-t border-slate-200 px-5 py-6 md:px-7 md:py-8">
                  {children}
                </div>
              </div>
            </div>
          </section>
        );
      }

      function Index() {
        return (
          <div className="min-h-screen">
            <Header />
            <main className="mx-auto w-full max-w-[1400px] px-4 py-8 md:px-10 md:py-12">
              <section className="mb-8 md:mb-10">
                <div className="relative overflow-hidden rounded-2xl border border-slate-200 bg-ep-gradient p-6 text-white shadow-premium md:p-10">
                  <div className="absolute inset-0 bg-ep-radial" />
                  <div className="relative max-w-3xl">
                    <span className="inline-flex items-center gap-2 rounded-full border border-ep-gold/40 bg-white/5 px-3 py-1 text-[11px] font-semibold uppercase tracking-[0.28em] text-ep-gold">
                      Return Analyzer Pro
                    </span>
                    <h1 className="mt-4 font-serif text-3xl font-semibold leading-tight md:text-5xl">
                      Zpětná modelace investičních strategií
                    </h1>
                    <p className="mt-3 max-w-2xl text-sm leading-relaxed text-white/80 md:text-base">
                      Prozkoumejte, jak by se vyvíjela vaše počáteční investice
                      v rámci tří doporučených profilů Erste Premier — nebo si
                      sestavte vlastní portfolio a získejte detailní analytický
                      report s metrikami rizika a výnosu.
                    </p>
                  </div>
                </div>
              </section>

              <div className="space-y-6">
                <CollapsibleSection
                  defaultOpen
                  title="Přednastavená portfolia"
                  description="Tři doporučené profily reflektující rizikový apetit klienta."
                  icon={<BarChart3Icon size={20} />}
                >
                  <PresetPortfolios />
                </CollapsibleSection>

                <CollapsibleSection
                  title="Vlastní portfolio (Builder)"
                  description="Sestavte si individuální alokaci a porovnejte ji s benchmarkem."
                  icon={<Settings2Icon size={20} />}
                >
                  <CustomPortfolioBuilder />
                </CollapsibleSection>
              </div>

              <footer className="mt-10 border-t border-slate-200 pt-6 text-center text-xs text-slate-500">
                © {new Date().getFullYear()} Erste Premier — Demo · Modelace na
                základě hypotetických historických dat. Nejedná se o investiční
                doporučení.
              </footer>
            </main>
          </div>
        );
      }

      function App() {
        return (
          <InvestmentProvider>
            <Index />
          </InvestmentProvider>
        );
      }

      /* ------------------------------------------------------------------ */
      /*  Mount                                                              */
      /* ------------------------------------------------------------------ */
      const rootEl = document.getElementById("root");
      ReactDOM.createRoot(rootEl).render(<App />);

      // Hide boot loader once React has rendered
      requestAnimationFrame(() => {
        const loader = document.getElementById("boot-loader");
        if (loader) {
          loader.style.opacity = "0";
          setTimeout(() => loader.remove(), 400);
        }
      });
    </script>
  </body>
</html>
