<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Návrh Pozemku a Domu</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Postranní panel */
        #sidebar {
            width: 340px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background-color: #f1f5f9;
        }

        .panel-header h1 {
            font-size: 1.2rem;
            margin: 0 0 5px 0;
            color: #0f172a;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #64748b;
            margin: 0;
        }

        .panel-content {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        h2 {
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Tlačítka a inputy (Sjednocený design) */
        .btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: 40px; /* Fixní výška pro všechna tlačítka */
            padding: 0 12px;
            margin-bottom: 8px;
            background-color: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
            color: var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            color: white;
        }

        .btn-danger {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            justify-content: center;
        }

        .btn-danger:hover {
            background-color: #fca5a5;
            color: #991b1b;
        }

        .custom-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .custom-inputs input {
            width: 50%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .custom-label-input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 8px;
            box-sizing: border-box;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-divider {
            height: 1px;
            background-color: var(--border);
            margin: 15px 0;
        }

        /* Pracovní plocha */
        #workspace {
            flex-grow: 1;
            position: relative;
            background-color: #e2e8f0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
            background-size: 20px 20px; /* 1 metr = 20px */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        .canvas-container {
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background-color: white;
        }

        #import-input { display: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="panel-header">
            <h1>Návrh Pozemku</h1>
            <p>1 dílek mřížky = 1 metr</p>
        </div>
        
        <div class="panel-content">
            <div class="section">
                <h2>Typy domů</h2>
                <button class="btn btn-primary" onclick="addHouse('blanka')">🏠 Dům (Blanka 36) - Detailní</button>
                <button class="btn btn-primary" onclick="addHouse('bungalowL')">📐 Bungalov do L (140 m²)</button>
                <button class="btn btn-primary" onclick="addHouse('longWide')">📏 Dlouhý široký dům (136 m²)</button>
                <button class="btn btn-primary" onclick="addHouse('classicBungalow')">🔲 Klasický bungalov (130 m²)</button>
            </div>

            <div class="section">
                <h2>Stavby a zpevněné plochy</h2>
                <button class="btn" onclick="addShape('carport')">🚗 Dvojitý přístřešek (6x6 m)</button>
                <button class="btn" onclick="addShape('gardenHouse')">🛖 Zahradní domek (5x3 m)</button>
                <button class="btn" onclick="addShape('terrace')">🪵 Terasa (6x4 m)</button>
                <button class="btn" onclick="addShape('driveway')">🛣️ Zpevněná cesta (5x3 m)</button>
                <button class="btn" onclick="addShape('stonePath')">👣 Nášlapná cesta (Dlažba 4x1 m)</button>
            </div>

            <div class="section">
                <h2>Zahrada, volný čas a doplňky</h2>
                <button class="btn" onclick="addShape('pool')">🏊 Bazén (6x3 m)</button>
                <button class="btn" onclick="addShape('dining')">🍽️ Venkovní posezení (pro 6 osob)</button>
                <button class="btn" onclick="addShape('lounge')">🛋️ Klidová zóna (gauč + křesla)</button>
                <button class="btn" onclick="addShape('firepit')">🔥 Ohniště (Ø 1.5 m)</button>
                <button class="btn" onclick="addShape('tree')">🌳 Strom (Ø 3 m)</button>
                <button class="btn" onclick="addShape('greenery')">🌿 Okrasná zeleň (3x2 m)</button>
                <button class="btn" onclick="addShape('flowerbed')">🌷 Záhon (3x1 m)</button>
                <button class="btn" onclick="addShape('trash')">🗑️ Popelnice (Sada 3ks)</button>
            </div>

            <div class="section-divider"></div>

            <div class="section">
                <h2>Vlastní prvek na míru</h2>
                <div class="custom-inputs">
                    <input type="number" id="custom-w" placeholder="Šířka (m)" min="0.1" step="0.1">
                    <input type="number" id="custom-h" placeholder="Délka (m)" min="0.1" step="0.1">
                </div>
                <input type="text" id="custom-label" class="custom-label-input" placeholder="Název objektu (např. Pískoviště)">
                <button class="btn" style="border-color: #94a3b8; font-weight: bold; justify-content: center;" onclick="addCustomShape()">➕ Vložit vlastní objekt</button>
            </div>

            <div class="section-divider"></div>

            <div class="section">
                <h2>Nástroje</h2>
                <button class="btn btn-danger" onclick="deleteSelected()">🗑️ Smazat vybrané (Del)</button>
            </div>

            <div class="section">
                <h2>Export / Import</h2>
                <button class="btn" style="justify-content: center;" onclick="exportPDF()">📄 Stáhnout jako PDF</button>
                <button class="btn" style="justify-content: center;" onclick="exportJSON()">💾 Uložit návrh (Soubor)</button>
                <button class="btn" style="justify-content: center;" onclick="document.getElementById('import-input').click()">📂 Načíst návrh</button>
                <input type="file" id="import-input" accept=".json" onchange="importJSON(event)">
            </div>
        </div>
    </div>

    <div id="workspace">
        <canvas id="c"></canvas>
    </div>

<script>
    const PPM = 20; 

    fabric.Object.prototype.transparentCorners = false;
    fabric.Object.prototype.cornerColor = '#2563eb';
    fabric.Object.prototype.cornerStyle = 'circle';
    fabric.Object.prototype.snapAngle = 90;
    fabric.Object.prototype.snapThreshold = 10;

    const canvas = new fabric.Canvas('c', {
        width: 1000,
        height: 850,
        preserveObjectStacking: true
    });

    // --- 1. VYKRESLENÍ POZEMKU ---
    function drawPlot() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        const outerPoints = [
            { x: 0 * PPM, y: 0 * PPM },
            { x: 14.98 * PPM, y: 0 * PPM },
            { x: 20 * PPM, y: 2.05 * PPM },
            { x: 20 * PPM, y: 34.63 * PPM },
            { x: 0 * PPM, y: 34.63 * PPM }
        ];

        // Zelená plocha je oddálená o 2m zleva, zprava a shora. Dole je nalepená na hranici (34.63)
        const innerPoints = [
            { x: 2 * PPM, y: 2 * PPM },
            { x: 14.58 * PPM, y: 2 * PPM },
            { x: 18 * PPM, y: 3.39 * PPM },
            { x: 18 * PPM, y: 34.63 * PPM }, 
            { x: 2 * PPM, y: 34.63 * PPM }  
        ];

        const hatchCanvas = document.createElement('canvas');
        hatchCanvas.width = 12;
        hatchCanvas.height = 12;
        const hctx = hatchCanvas.getContext('2d');
        hctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        hctx.lineWidth = 1.5;
        hctx.beginPath();
        hctx.moveTo(0, 12);
        hctx.lineTo(12, 0);
        hctx.stroke();

        const hatchPattern = new fabric.Pattern({ source: hatchCanvas, repeat: 'repeat' });

        const outerHatch = new fabric.Polygon(outerPoints, {
            left: centerX, top: centerY, originX: 'center', originY: 'center',
            fill: hatchPattern, stroke: '#ef4444', strokeWidth: 1,
            selectable: false, evented: false
        });

        const innerPlot = new fabric.Polygon(innerPoints, {
            left: centerX, top: centerY, originX: 'center', originY: 'center',
            fill: '#e2f0d9', stroke: '#7e9c65', strokeWidth: 1.5,
            selectable: false, evented: false
        });

        // Původní detailní popisek, navíc s objectCaching: false proti rozmazání
        const text = new fabric.Text("Pozemek 250/25\nRozloha: 680.6 m²\n(Sever, východ, západ = 2m hranice)", {
            left: centerX, top: centerY, fontSize: 15, fill: '#557041',
            textAlign: 'center', originX: 'center', originY: 'center',
            selectable: false, evented: false, objectCaching: false
        });

        canvas.add(outerHatch, innerPlot, text);
        canvas.sendToBack(text);
        canvas.sendToBack(innerPlot);
        canvas.sendToBack(outerHatch);
    }

    drawPlot();

    // --- 2. VLOŽENÍ DOMŮ ---
    function addHouse(type) {
        let objs = [];
        let groupW, groupH;

        if (type === 'blanka') {
            const w = 9.7 * PPM, h = 7.9 * PPM;
            objs.push(new fabric.Rect({ left: 0, top: 0, width: w, height: h, fill: '#ffffff', stroke: '#333', strokeWidth: 3 }));
            objs.push(new fabric.Rect({ left: 5, top: 5, width: 85, height: 148, fill: '#fff0db', stroke: '#888', strokeWidth: 1 }));
            objs.push(new fabric.Text("Obývák +\nKuchyně", { left: 47, top: 79, fontSize: 11, originX: 'center', originY: 'center', fill: '#555', objectCaching: false }));
            objs.push(new fabric.Rect({ left: 135, top: 5, width: 54, height: 70, fill: '#fff0db', stroke: '#888', strokeWidth: 1 }));
            objs.push(new fabric.Text("Pokoj", { left: 162, top: 40, fontSize: 11, originX: 'center', originY: 'center', fill: '#555', objectCaching: false }));
            objs.push(new fabric.Rect({ left: 135, top: 80, width: 54, height: 35, fill: '#e0f2fe', stroke: '#888', strokeWidth: 1 }));
            objs.push(new fabric.Text("Koupelna", { left: 162, top: 97, fontSize: 10, originX: 'center', originY: 'center', fill: '#555', objectCaching: false }));
            objs.push(new fabric.Rect({ left: 135, top: 120, width: 54, height: 33, fill: '#f1f5f9', stroke: '#888', strokeWidth: 1 }));
            objs.push(new fabric.Text("Tech.", { left: 162, top: 136, fontSize: 10, originX: 'center', originY: 'center', fill: '#555', objectCaching: false }));
            objs.push(new fabric.Triangle({ left: 112, top: h + 10, width: 15, height: 15, fill: 'black', angle: 180, originX: 'center', originY: 'center' }));
        } 
        else if (type === 'bungalowL') {
            objs.push(new fabric.Rect({ left: 0, top: 0, width: 8*PPM, height: 14*PPM, fill: '#fff', stroke: '#333', strokeWidth: 2 }));
            objs.push(new fabric.Rect({ left: 8*PPM, top: 8*PPM, width: 6*PPM, height: 6*PPM, fill: '#fff', stroke: '#333', strokeWidth: 2 }));
            objs.push(new fabric.Line([4*PPM, 0, 4*PPM, 14*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Line([8*PPM, 11*PPM, 14*PPM, 11*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Line([4*PPM, 11*PPM, 8*PPM, 11*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Text("Bungalov L\n(140 m²)", { left: 4*PPM, top: 4*PPM, fontSize: 12, originX: 'center', originY: 'center', objectCaching: false }));
        }
        else if (type === 'longWide') {
            objs.push(new fabric.Rect({ left: 0, top: 0, width: 17*PPM, height: 8*PPM, fill: '#fff', stroke: '#333', strokeWidth: 2 }));
            objs.push(new fabric.Line([3*PPM, 4*PPM, 14*PPM, 4*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Line([0, 0, 3*PPM, 4*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Line([0, 8*PPM, 3*PPM, 4*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Line([17*PPM, 0, 14*PPM, 4*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Line([17*PPM, 8*PPM, 14*PPM, 4*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Text("Široký dům\n(136 m²)", { left: 8.5*PPM, top: 4*PPM, fontSize: 12, originX: 'center', originY: 'center', objectCaching: false }));
        }
        else if (type === 'classicBungalow') {
            objs.push(new fabric.Rect({ left: 0, top: 0, width: 13*PPM, height: 10*PPM, fill: '#fff', stroke: '#333', strokeWidth: 2 }));
            objs.push(new fabric.Line([3.5*PPM, 5*PPM, 9.5*PPM, 5*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Line([0, 0, 3.5*PPM, 5*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Line([0, 10*PPM, 3.5*PPM, 5*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Line([13*PPM, 0, 9.5*PPM, 5*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Line([13*PPM, 10*PPM, 9.5*PPM, 5*PPM], {stroke: '#888', strokeWidth: 1}));
            objs.push(new fabric.Text("Klasický\nBungalov", { left: 6.5*PPM, top: 5*PPM, fontSize: 12, originX: 'center', originY: 'center', objectCaching: false }));
        }

        const group = new fabric.Group(objs, {
            left: canvas.width / 2, top: canvas.height / 2,
            originX: 'center', originY: 'center',
            hasControls: true
        });
        canvas.add(group);
        canvas.setActiveObject(group);
    }

    // --- 3. KNIHOVNA OSTATNÍCH OBJEKTŮ ---
    function addShape(type) {
        let objs = [];
        let w = 0, h = 0, labelText = '';

        switch(type) {
            case 'carport': 
                w = 6*PPM; h = 6*PPM; labelText = 'Přístřešek';
                objs.push(new fabric.Rect({ left: 0, top: 0, width: w, height: h, fill: 'rgba(203, 213, 225, 0.9)', stroke: '#475569' }));
                const ps = 0.3*PPM;
                objs.push(new fabric.Rect({ left: 0.2*PPM, top: 0.2*PPM, width: ps, height: ps, fill: '#1e293b' }));
                objs.push(new fabric.Rect({ left: w-ps-0.2*PPM, top: 0.2*PPM, width: ps, height: ps, fill: '#1e293b' }));
                objs.push(new fabric.Rect({ left: 0.2*PPM, top: h-ps-0.2*PPM, width: ps, height: ps, fill: '#1e293b' }));
                objs.push(new fabric.Rect({ left: w-ps-0.2*PPM, top: h-ps-0.2*PPM, width: ps, height: ps, fill: '#1e293b' }));
                objs.push(new fabric.Line([w/2, 0, w/2, h], {stroke: '#64748b', strokeDashArray: [5, 5]}));
                break;
            case 'gardenHouse': 
                w = 5*PPM; h = 3*PPM; labelText = 'Domek';
                objs.push(new fabric.Rect({ left: 0, top: 0, width: w, height: h, fill: '#d4a373', stroke: '#8b5a2b', strokeWidth: 1.5 }));
                objs.push(new fabric.Line([0, h/2, w, h/2], {stroke: '#78350f', strokeWidth: 2}));
                break;
            case 'terrace': 
                w = 6*PPM; h = 4*PPM; labelText = 'Terasa';
                objs.push(new fabric.Rect({ left: 0, top: 0, width: w, height: h, fill: '#fcd34d', stroke: '#b45309' }));
                for(let i=1; i<8; i++) objs.push(new fabric.Line([0, i*0.5*PPM, w, i*0.5*PPM], { stroke: '#d97706', strokeWidth: 1 }));
                break;
            case 'driveway': 
                w = 5*PPM; h = 3*PPM; labelText = 'Cesta';
                objs.push(new fabric.Rect({ left: 0, top: 0, width: w, height: h, fill: '#e5e7eb', stroke: '#9ca3af' }));
                objs.push(new fabric.Rect({ left: 0.2*PPM, top: 0.2*PPM, width: w-0.4*PPM, height: h-0.4*PPM, fill: 'transparent', stroke: '#d1d5db', strokeDashArray: [3,3] }));
                break;
            case 'stonePath': 
                w = 4*PPM; h = 1*PPM;
                objs.push(new fabric.Rect({ left: 0, top: 0, width: w, height: h, fill: 'transparent' })); // Wrapper pro zarovnání skupiny
                for(let i=0; i<4; i++) {
                    objs.push(new fabric.Rect({ left: i*PPM + 0.1*PPM, top: 0.1*PPM, width: 0.8*PPM, height: 0.8*PPM, fill: '#94a3b8', stroke: '#64748b', rx: 4, ry: 4 }));
                }
                break;
            case 'pool': 
                w = 6*PPM; h = 3*PPM; labelText = 'Bazén';
                objs.push(new fabric.Rect({ left: 0, top: 0, width: w, height: h, fill: '#7dd3fc', stroke: '#0284c7', rx: 3, ry: 3, strokeWidth: 2 }));
                objs.push(new fabric.Rect({ left: 0.2*PPM, top: 0.2*PPM, width: w-0.4*PPM, height: h-0.4*PPM, fill: '#38bdf8', rx: 2, ry: 2 }));
                objs.push(new fabric.Rect({ left: w-0.8*PPM, top: 0.5*PPM, width: 0.6*PPM, height: 0.15*PPM, fill: '#fff' }));
                objs.push(new fabric.Rect({ left: w-0.8*PPM, top: 0.8*PPM, width: 0.6*PPM, height: 0.15*PPM, fill: '#fff' }));
                break;
            case 'firepit': 
                w = 1.5*PPM; h = 1.5*PPM;
                objs.push(new fabric.Circle({ left: 0, top: 0, radius: w/2, fill: '#9ca3af', stroke: '#4b5563' }));
                objs.push(new fabric.Circle({ left: 0.3*PPM, top: 0.3*PPM, radius: 0.45*PPM, fill: '#27272a' }));
                objs.push(new fabric.Circle({ left: 0.45*PPM, top: 0.45*PPM, radius: 0.3*PPM, fill: '#ef4444' }));
                objs.push(new fabric.Circle({ left: 0.55*PPM, top: 0.55*PPM, radius: 0.2*PPM, fill: '#fbbf24' }));
                break;
            case 'tree': 
                w = 3*PPM; h = 3*PPM;
                objs.push(new fabric.Circle({ left: 0, top: 0, radius: w/2, fill: '#22c55e', opacity: 0.9 }));
                objs.push(new fabric.Circle({ left: 0.4*PPM, top: 0.4*PPM, radius: 0.9*PPM, fill: '#4ade80', opacity: 0.8 }));
                objs.push(new fabric.Circle({ left: 1.3*PPM, top: 1.3*PPM, radius: 0.2*PPM, fill: '#78350f' }));
                break;
            case 'greenery': 
                w = 3*PPM; h = 2*PPM;
                objs.push(new fabric.Circle({ left: 0, top: 0.2*PPM, radius: 0.8*PPM, fill: '#86efac', stroke: '#22c55e' }));
                objs.push(new fabric.Circle({ left: 1.4*PPM, top: 0, radius: 1*PPM, fill: '#4ade80', stroke: '#16a34a' }));
                objs.push(new fabric.Circle({ left: 1*PPM, top: 0.6*PPM, radius: 0.7*PPM, fill: '#22c55e', stroke: '#15803d' }));
                break;
            case 'flowerbed':
                w = 3*PPM; h = 1*PPM;
                objs.push(new fabric.Rect({ left: 0, top: 0, width: w, height: h, fill: '#78350f', stroke: '#451a03', rx: 2, ry: 2 }));
                for(let i=0.5; i<3; i++) {
                    objs.push(new fabric.Circle({ left: i*PPM - 0.2*PPM, top: 0.3*PPM, radius: 0.2*PPM, fill: '#22c55e' }));
                }
                break;
            case 'dining':
                w = 3*PPM; h = 2.5*PPM;
                objs.push(new fabric.Rect({ left: 0, top: 0, width: w, height: h, fill: '#f3f4f6', rx: 4, ry: 4, stroke: '#e5e7eb' }));
                objs.push(new fabric.Rect({ left: 0.5*PPM, top: 0.8*PPM, width: 2*PPM, height: 0.9*PPM, fill: '#d4a373', stroke: '#b45309' }));
                [0.7, 1.3, 1.9].forEach(x => {
                    objs.push(new fabric.Circle({ left: x*PPM, top: 0.3*PPM, radius: 0.2*PPM, fill: '#9ca3af' }));
                    objs.push(new fabric.Circle({ left: x*PPM, top: 1.8*PPM, radius: 0.2*PPM, fill: '#9ca3af' }));
                });
                break;
            case 'lounge':
                w = 4*PPM; h = 3*PPM;
                objs.push(new fabric.Rect({ left: 0, top: 0, width: w, height: h, fill: '#e5e7eb', rx: 5, ry: 5 }));
                objs.push(new fabric.Rect({ left: 1.5*PPM, top: 1.2*PPM, width: 1*PPM, height: 0.6*PPM, fill: '#8b5a2b', rx: 2, ry: 2 }));
                objs.push(new fabric.Rect({ left: 0.8*PPM, top: 2*PPM, width: 2.4*PPM, height: 0.8*PPM, fill: '#4b5563', rx: 3, ry: 3 }));
                objs.push(new fabric.Rect({ left: 0.8*PPM, top: 0.2*PPM, width: 0.8*PPM, height: 0.8*PPM, fill: '#4b5563', rx: 3, ry: 3 }));
                objs.push(new fabric.Rect({ left: 2.4*PPM, top: 0.2*PPM, width: 0.8*PPM, height: 0.8*PPM, fill: '#4b5563', rx: 3, ry: 3 }));
                break;
            case 'trash':
                w = 2*PPM; h = 0.8*PPM;
                objs.push(new fabric.Rect({ left: 0, top: 0, width: w, height: h, fill: 'transparent' }));
                objs.push(new fabric.Rect({ left: 0, top: 0.1*PPM, width: 0.6*PPM, height: 0.6*PPM, fill: '#374151', rx: 2, ry: 2 }));
                objs.push(new fabric.Rect({ left: 0.7*PPM, top: 0.1*PPM, width: 0.6*PPM, height: 0.6*PPM, fill: '#1f2937', rx: 2, ry: 2 }));
                objs.push(new fabric.Rect({ left: 1.4*PPM, top: 0.1*PPM, width: 0.6*PPM, height: 0.6*PPM, fill: '#4b5563', rx: 2, ry: 2 }));
                break;
        }

        if(labelText) {
            objs.push(new fabric.Text(labelText, {
                left: w/2, top: h/2, fontSize: 11, fontFamily: 'sans-serif',
                fill: '#000', textAlign: 'center', originX: 'center', originY: 'center',
                textBackgroundColor: 'rgba(255,255,255,0.6)', objectCaching: false
            }));
        }

        const group = new fabric.Group(objs, {
            left: canvas.width / 2, top: canvas.height / 2,
            originX: 'center', originY: 'center',
            hasControls: true, transparentCorners: false
        });

        canvas.add(group);
        canvas.setActiveObject(group);
    }

    // --- 4. VLASTNÍ PRVEK ---
    function addCustomShape() {
        const wVal = parseFloat(document.getElementById('custom-w').value);
        const hVal = parseFloat(document.getElementById('custom-h').value);
        const label = document.getElementById('custom-label').value || 'Objekt';
        
        if(!wVal || !hVal || wVal <= 0 || hVal <= 0) {
            alert('Zadejte platné rozměry v metrech (např. 6 a 2).');
            return;
        }

        const w = wVal * PPM;
        const h = hVal * PPM;

        const shape = new fabric.Rect({ left: 0, top: 0, width: w, height: h, fill: '#cbd5e1', stroke: '#64748b', strokeWidth: 2 });
        const text = new fabric.Text(label + `\n(${wVal}x${hVal}m)`, {
            left: w/2, top: h/2, fontSize: 12, fontFamily: 'sans-serif', fill: '#000',
            textAlign: 'center', originX: 'center', originY: 'center', objectCaching: false
        });

        const group = new fabric.Group([shape, text], {
            left: canvas.width / 2, top: canvas.height / 2,
            originX: 'center', originY: 'center',
            hasControls: true
        });

        canvas.add(group);
        canvas.setActiveObject(group);
    }

    // --- 5. OVLÁDÁNÍ A MAZÁNÍ ---
    function deleteSelected() {
        const activeObject = canvas.getActiveObject();
        if (activeObject) {
            canvas.remove(activeObject);
            canvas.discardActiveObject();
        }
    }

    window.addEventListener('keydown', function(e) {
        if (e.key === 'Delete' || e.key === 'Backspace') {
            if (e.target.tagName !== 'INPUT') {
                deleteSelected();
                e.preventDefault();
            }
        }
    });

    canvas.on('mouse:down', function(options) {
        if(options.target && options.target.selectable) {
            options.target.bringToFront();
        }
    });

    // --- 6. EXPORT / IMPORT ---
    function exportJSON() {
        const json = canvas.toJSON();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(json));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", "navrh-pozemku.json");
        dlAnchorElem.click();
    }

    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(f) {
            const data = f.target.result;
            canvas.loadFromJSON(data, function() {
                canvas.renderAll();
                const objects = canvas.getObjects();
                for(let i = 0; i < 3; i++) {
                    if(objects[i]) {
                        objects[i].set({selectable: false, evented: false});
                        canvas.sendToBack(objects[i]);
                    }
                }
            });
        };
        reader.readAsText(file);
    }

    function exportPDF() {
        canvas.discardActiveObject();
        canvas.renderAll();
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width, canvas.height] });
        const imgData = canvas.toDataURL({ format: 'jpeg', quality: 1.0 });
        doc.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
        doc.save('muj-navrh-pozemku.pdf');
    }
</script>
</body>
</html>
