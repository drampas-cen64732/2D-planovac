<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Návrh Pozemku a Domu</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Postranní panel */
        #sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background-color: #f1f5f9;
        }

        .panel-header h1 {
            font-size: 1.2rem;
            margin: 0 0 5px 0;
            color: #0f172a;
        }

        .panel-content {
            padding: 15px;
            flex-grow: 1;
            overflow-y: auto;
        }

        h2 {
            font-size: 0.85rem;
            margin-top: 15px;
            margin-bottom: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 5px;
        }

        /* Sjednocená tlačítka */
        .btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: 40px; /* Fixní výška pro všechna tlačítka */
            padding: 0 15px;
            margin-bottom: 6px;
            background-color: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
        }

        .btn:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
            color: var(--primary);
            transform: translateX(3px);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            justify-content: center;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            color: white;
        }

        .btn-danger {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-danger:hover {
            background-color: #fca5a5;
            color: #991b1b;
        }

        /* Sekce pro vlastní rozměry */
        .custom-box {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        .custom-inputs {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .custom-inputs input, .custom-label-input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.85rem;
            width: 100%;
            box-sizing: border-box;
        }

        /* Pracovní plocha */
        #workspace {
            flex-grow: 1;
            background-color: #e2e8f0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        #import-input { display: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="panel-header">
            <h1>Návrh Pozemku</h1>
            <p style="font-size: 0.8rem; color: #64748b; margin:0;">Měřítko: 1 mřížka = 1 metr</p>
        </div>
        
        <div class="panel-content">
            <h2>Typy domů</h2>
            <button class="btn btn-primary" onclick="addHouse('blanka')">🏠 Dům Blanka 36</button>
            <button class="btn btn-primary" onclick="addHouse('bungalowL')">📐 Bungalov do L (140 m²)</button>
            <button class="btn btn-primary" onclick="addHouse('longWide')">📏 Dlouhý široký dům</button>
            <button class="btn btn-primary" onclick="addHouse('classicBungalow')">🔲 Klasický bungalov</button>

            <h2>Stavby</h2>
            <button class="btn" onclick="addShape('carport')">🚗 Přístřešek (6x6 m)</button>
            <button class="btn" onclick="addShape('gardenHouse')">🛖 Zahradní domek (5x3 m)</button>
            <button class="btn" onclick="addShape('terrace')">🪵 Terasa (6x4 m)</button>
            <button class="btn" onclick="addShape('driveway')">🛣️ Zpevněná cesta (5x3 m)</button>
            <button class="btn" onclick="addShape('stonePath')">👣 Nášlapná cesta (4x1 m)</button>

            <h2>Zahrada a relax</h2>
            <button class="btn" onclick="addShape('pool')">🏊 Bazén (6x3 m)</button>
            <button class="btn" onclick="addShape('dining')">🍽️ Posezení 6 osob</button>
            <button class="btn" onclick="addShape('lounge')">🛋️ Relax zóna s gaučem</button>
            <button class="btn" onclick="addShape('firepit')">🔥 Ohniště</button>
            <button class="btn" onclick="addShape('tree')">🌳 Strom</button>
            <button class="btn" onclick="addShape('greenery')">🌿 Okrasná zeleň</button>
            <button class="btn" onclick="addShape('flowerbed')">🌷 Záhon</button>
            <button class="btn" onclick="addShape('trash')">🗑️ Popelnice</button>

            <h2>Vlastní prvek</h2>
            <div class="custom-box">
                <div class="custom-inputs">
                    <input type="number" id="custom-w" placeholder="Šířka (m)" step="0.1">
                    <input type="number" id="custom-h" placeholder="Délka (m)" step="0.1">
                </div>
                <input type="text" id="custom-label" class="custom-label-input" placeholder="Název objektu" style="margin-bottom: 8px;">
                <button class="btn btn-primary" style="height: 35px; font-size: 0.8rem;" onclick="addCustomShape()">Vložit vlastní rozměr</button>
            </div>

            <button class="btn btn-danger" onclick="deleteSelected()">🗑️ Smazat vybrané</button>

            <h2>Export</h2>
            <button class="btn" onclick="exportPDF()">📄 Stáhnout PDF</button>
            <button class="btn" onclick="exportJSON()">💾 Uložit projekt</button>
            <button class="btn" onclick="document.getElementById('import-input').click()">📂 Načíst projekt</button>
            <input type="file" id="import-input" accept=".json" onchange="importJSON(event)">
        </div>
    </div>

    <div id="workspace">
        <canvas id="c"></canvas>
    </div>

<script>
    const PPM = 20; 
    fabric.Object.prototype.transparentCorners = false;
    fabric.Object.prototype.cornerColor = '#2563eb';
    fabric.Object.prototype.cornerStyle = 'circle';
    fabric.Object.prototype.snapAngle = 45;

    const canvas = new fabric.Canvas('c', {
        width: 1000,
        height: 850,
        preserveObjectStacking: true
    });

    // --- 1. VYKRESLENÍ POZEMKU ---
    function drawPlot() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // Celý pozemek
        const outerPoints = [
            { x: 0 * PPM, y: 0 * PPM },
            { x: 14.98 * PPM, y: 0 * PPM },
            { x: 20 * PPM, y: 2.05 * PPM },
            { x: 20 * PPM, y: 34.63 * PPM },
            { x: 0 * PPM, y: 34.63 * PPM }
        ];

        // Stavitelná plocha (offset 2m nahoře, vlevo, vpravo | dole 0m)
        const innerPoints = [
            { x: 2 * PPM, y: 2 * PPM },
            { x: 14.58 * PPM, y: 2 * PPM },
            { x: 18 * PPM, y: 3.39 * PPM },
            { x: 18 * PPM, y: 34.63 * PPM }, 
            { x: 2 * PPM, y: 34.63 * PPM }  
        ];

        // Šrafování pouze pro vymezení 2m hranic (vynecháme spodek)
        const hatchCanvas = document.createElement('canvas');
        hatchCanvas.width = 10; hatchCanvas.height = 10;
        const hctx = hatchCanvas.getContext('2d');
        hctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        hctx.lineWidth = 1;
        hctx.beginPath(); hctx.moveTo(0, 10); hctx.lineTo(10, 0); hctx.stroke();
        const hatchPattern = new fabric.Pattern({ source: hatchCanvas, repeat: 'repeat' });

        // Objekt šrafování (Polygon, který odečte vnitřek od vnějšku, ale jen tam kde chceme)
        const outerHatch = new fabric.Polygon(outerPoints, {
            left: centerX, top: centerY, originX: 'center', originY: 'center',
            fill: hatchPattern, stroke: '#ef4444', strokeWidth: 0.5,
            selectable: false, evented: false
        });

        const innerPlot = new fabric.Polygon(innerPoints, {
            left: centerX, top: centerY, originX: 'center', originY: 'center',
            fill: '#e2f0d9', stroke: '#7e9c65', strokeWidth: 1.5,
            selectable: false, evented: false
        });

        canvas.add(outerHatch, innerPlot);
        canvas.sendToBack(innerPlot);
        canvas.sendToBack(outerHatch);
    }

    drawPlot();

    // --- 2. FUNKCE PRO TEXT (Ochrana proti rozmazání) ---
    function createText(str, size = 11, color = '#000') {
        return new fabric.Text(str, {
            fontSize: size,
            fontFamily: 'Segoe UI',
            fill: color,
            textAlign: 'center',
            originX: 'center',
            originY: 'center',
            objectCaching: false // KLÍČOVÉ: Zamezí rozmazání textu při změně měřítka
        });
    }

    // --- 3. TYPY DOMŮ ---
    function addHouse(type) {
        let objs = [];
        if (type === 'blanka') {
            const w = 9.7 * PPM, h = 7.9 * PPM;
            objs.push(new fabric.Rect({ width: w, height: h, fill: '#fff', stroke: '#333', strokeWidth: 2 }));
            objs.push(createText("Blanka 36", 14).set({top: -10}));
        } 
        else if (type === 'bungalowL') {
            objs.push(new fabric.Rect({ width: 8*PPM, height: 14*PPM, fill: '#fff', stroke: '#333', strokeWidth: 2 }));
            objs.push(new fabric.Rect({ left: 4*PPM, top: 4*PPM, width: 6*PPM, height: 6*PPM, fill: '#fff', stroke: '#333', strokeWidth: 2 }));
            objs.push(createText("Bungalov L", 12));
        }
        else if (type === 'longWide') {
            objs.push(new fabric.Rect({ width: 17*PPM, height: 8*PPM, fill: '#fff', stroke: '#333', strokeWidth: 2 }));
            objs.push(createText("Dům 136m²", 12));
        }
        else if (type === 'classicBungalow') {
            objs.push(new fabric.Rect({ width: 13*PPM, height: 10*PPM, fill: '#fff', stroke: '#333', strokeWidth: 2 }));
            objs.push(createText("Bungalov", 12));
        }

        const group = new fabric.Group(objs, {
            left: canvas.width / 2, top: canvas.height / 2,
            originX: 'center', originY: 'center'
        });
        canvas.add(group);
        canvas.setActiveObject(group);
    }

    // --- 4. OSTATNÍ OBJEKTY ---
    function addShape(type) {
        let objs = [];
        let label = "";

        switch(type) {
            case 'carport': 
                objs.push(new fabric.Rect({ width: 6*PPM, height: 6*PPM, fill: 'rgba(200,200,200,0.8)', stroke: '#666' }));
                label = "Přístřešek"; break;
            case 'gardenHouse': 
                objs.push(new fabric.Rect({ width: 5*PPM, height: 3*PPM, fill: '#d4a373', stroke: '#8b5a2b' }));
                label = "Domek"; break;
            case 'terrace': 
                objs.push(new fabric.Rect({ width: 6*PPM, height: 4*PPM, fill: '#fcd34d', stroke: '#b45309' }));
                label = "Terasa"; break;
            case 'driveway': 
                objs.push(new fabric.Rect({ width: 5*PPM, height: 3*PPM, fill: '#cbd5e1', stroke: '#94a3b8' }));
                label = "Cesta"; break;
            case 'stonePath': 
                for(let i=0; i<4; i++) {
                    objs.push(new fabric.Rect({ left: i*PPM*1.1 - 35, top: 0, width: 0.8*PPM, height: 0.6*PPM, fill: '#94a3b8', rx: 5, ry: 5, stroke: '#64748b' }));
                }
                break; // Bez labelu
            case 'pool': 
                objs.push(new fabric.Rect({ width: 6*PPM, height: 3*PPM, fill: '#38bdf8', stroke: '#0284c7', rx: 5, ry: 5 }));
                label = "Bazén"; break;
            case 'firepit': 
                objs.push(new fabric.Circle({ radius: 0.75*PPM, fill: '#94a3b8', stroke: '#475569' }));
                objs.push(new fabric.Circle({ radius: 0.4*PPM, fill: '#ef4444', left: 7, top: 7 }));
                break;
            case 'tree': 
                objs.push(new fabric.Circle({ radius: 1.5*PPM, fill: '#22c55e', opacity: 0.8 }));
                objs.push(new fabric.Circle({ radius: 0.3*PPM, fill: '#78350f', left: 24, top: 24 }));
                break;
            case 'greenery': 
                objs.push(new fabric.Ellipse({ rx: 1.5*PPM, ry: 1*PPM, fill: '#86efac', stroke: '#16a34a' }));
                break;
            case 'flowerbed':
                objs.push(new fabric.Rect({ width: 3*PPM, height: 1*PPM, fill: '#78350f', stroke: '#451a03' }));
                break;
            case 'dining':
                objs.push(new fabric.Rect({ width: 2.5*PPM, height: 1.5*PPM, fill: '#d4a373', stroke: '#b45309' })); // Stůl
                for(let i=0; i<3; i++) { // Židle
                    objs.push(new fabric.Rect({ left: i*16, top: -10, width: 10, height: 10, fill: '#64748b' }));
                    objs.push(new fabric.Rect({ left: i*16, top: 30, width: 10, height: 10, fill: '#64748b' }));
                }
                break;
            case 'lounge':
                objs.push(new fabric.Rect({ width: 3*PPM, height: 1*PPM, fill: '#4b5563', rx: 5 })); // Gauč
                objs.push(new fabric.Rect({ left: -25, top: 25, width: 1*PPM, height: 1*PPM, fill: '#4b5563', rx: 5 })); // Křeslo
                objs.push(new fabric.Rect({ left: 25, top: 25, width: 1*PPM, height: 1*PPM, fill: '#4b5563', rx: 5 })); // Křeslo
                break;
            case 'trash':
                for(let i=0; i<3; i++) {
                    objs.push(new fabric.Rect({ left: i*15 - 15, width: 12, height: 12, fill: '#334155', rx: 2 }));
                }
                break;
        }

        if(label) {
            objs.push(createText(label).set({ top: 0 }));
        }

        const group = new fabric.Group(objs, {
            left: canvas.width / 2, top: canvas.height / 2,
            originX: 'center', originY: 'center'
        });
        canvas.add(group);
        canvas.setActiveObject(group);
    }

    // --- 5. VLASTNÍ PRVEK ---
    function addCustomShape() {
        const wVal = parseFloat(document.getElementById('custom-w').value);
        const hVal = parseFloat(document.getElementById('custom-h').value);
        const label = document.getElementById('custom-label').value || 'Objekt';
        
        if(!wVal || !hVal) return alert('Zadejte rozměry');

        const w = wVal * PPM;
        const h = hVal * PPM;

        const rect = new fabric.Rect({ width: w, height: h, fill: '#cbd5e1', stroke: '#64748b', strokeWidth: 1 });
        const text = createText(label + `\n(${wVal}x${hVal}m)`, 10);

        const group = new fabric.Group([rect, text], {
            left: canvas.width / 2, top: canvas.height / 2,
            originX: 'center', originY: 'center'
        });
        canvas.add(group);
        canvas.setActiveObject(group);
    }

    // --- OSTATNÍ FUNKCE (MAZÁNÍ, EXPORT) ---
    function deleteSelected() {
        const active = canvas.getActiveObject();
        if (active) { canvas.remove(active); canvas.discardActiveObject(); }
    }

    window.addEventListener('keydown', (e) => { if (e.key === 'Delete') deleteSelected(); });

    function exportJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(canvas.toJSON()));
        const dl = document.createElement('a');
        dl.setAttribute("href", dataStr); dl.setAttribute("download", "navrh.json"); dl.click();
    }

    function importJSON(event) {
        const reader = new FileReader();
        reader.onload = (f) => {
            canvas.loadFromJSON(f.target.result, () => {
                canvas.renderAll();
                canvas.getObjects().forEach((obj, i) => { if(i<2) { obj.set({selectable:false, evented:false}); canvas.sendToBack(obj); } });
            });
        };
        reader.readAsText(event.target.files[0]);
    }

    function exportPDF() {
        canvas.discardActiveObject().renderAll();
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'px', format: [canvas.width, canvas.height] });
        doc.addImage(canvas.toDataURL({ format: 'jpeg', quality: 1.0 }), 'JPEG', 0, 0, canvas.width, canvas.height);
        doc.save('navrh-pozemku.pdf');
    }
</script>
</body>
</html>
