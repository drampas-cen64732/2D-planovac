<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Návrh Pozemku a Domu</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Postranní panel */
        #sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background-color: #f1f5f9;
        }

        .panel-header h1 {
            font-size: 1.2rem;
            margin: 0 0 5px 0;
            color: #0f172a;
        }

        .panel-header p {
            font-size: 0.85rem;
            color: #64748b;
            margin: 0;
        }

        .panel-content {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        h2 {
            font-size: 1rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Tlačítka */
        .btn {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 10px;
            background-color: white;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .btn:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
            color: var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            text-align: center;
            justify-content: center;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            color: white;
        }

        .btn-danger {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            text-align: center;
            justify-content: center;
        }

        .btn-danger:hover {
            background-color: #fca5a5;
            color: #991b1b;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-divider {
            height: 1px;
            background-color: var(--border);
            margin: 20px 0;
        }

        /* Pracovní plocha */
        #workspace {
            flex-grow: 1;
            position: relative;
            background-color: #e2e8f0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
            background-size: 20px 20px; /* 1 metr = 20px */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        .canvas-container {
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background-color: white;
        }

        /* Skryté inputy */
        #import-input {
            display: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="panel-header">
            <h1>Návrh Pozemku</h1>
            <p>1 dílek mřížky = 1 metr</p>
        </div>
        
        <div class="panel-content">
            <div class="section">
                <h2>Hlavní objekty</h2>
                <button class="btn btn-primary" onclick="addHouse()">
                    🏠 Vložit dům (Blanka 36)
                </button>
            </div>

            <div class="section">
                <h2>Stavby a zpevněné plochy</h2>
                <button class="btn" onclick="addShape('carport')">🚗 Dvojitý přístřešek (6x6 m)</button>
                <button class="btn" onclick="addShape('gardenHouse')">🛖 Zahradní domek (5x3 m)</button>
                <button class="btn" onclick="addShape('terrace')">🪵 Terasa (6x4 m)</button>
                <button class="btn" onclick="addShape('driveway')">🛣️ Zpevněná cesta (5x3 m)</button>
            </div>

            <div class="section">
                <h2>Zahrada a volný čas</h2>
                <button class="btn" onclick="addShape('pool')">🏊 Bazén (6x3 m)</button>
                <button class="btn" onclick="addShape('firepit')">🔥 Ohniště (Ø 1.5 m)</button>
                <button class="btn" onclick="addShape('tree')">🌳 Strom (Ø 3 m)</button>
                <button class="btn" onclick="addShape('greenery')">🌷 Okrasná zeleň (3x2 m)</button>
            </div>

            <div class="section-divider"></div>

            <div class="section">
                <h2>Nástroje</h2>
                <button class="btn btn-danger" onclick="deleteSelected()">🗑️ Smazat vybrané</button>
            </div>

            <div class="section">
                <h2>Export / Import</h2>
                <button class="btn" onclick="exportPDF()">📄 Stáhnout jako PDF</button>
                <button class="btn" onclick="exportJSON()">💾 Uložit návrh (Soubor)</button>
                <button class="btn" onclick="document.getElementById('import-input').click()">📂 Načíst návrh</button>
                <input type="file" id="import-input" accept=".json" onchange="importJSON(event)">
            </div>
        </div>
    </div>

    <div id="workspace">
        <canvas id="c"></canvas>
    </div>

<script>
    // --- KONFIGURACE MĚŘÍTKA ---
    const PPM = 20; // 1 metr v reálu = 20 pixelů na plátně

    // Globální nastavení manipulace a rotace
    fabric.Object.prototype.transparentCorners = false;
    fabric.Object.prototype.cornerColor = '#2563eb';
    fabric.Object.prototype.cornerStyle = 'circle';
    fabric.Object.prototype.snapAngle = 90;      // Přitáhnout po 90 stupních
    fabric.Object.prototype.snapThreshold = 10;  // Tolerance pro přitažení

    const canvas = new fabric.Canvas('c', {
        width: 1000,
        height: 850,
        preserveObjectStacking: true
    });

    // --- 1. VYKRESLENÍ POZEMKU ---
    function drawPlot() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // Souřadnice hranic parcely
        const outerPoints = [
            { x: 0 * PPM, y: 0 * PPM },
            { x: 14.98 * PPM, y: 0 * PPM },
            { x: 20 * PPM, y: 2.05 * PPM },
            { x: 20 * PPM, y: 34.63 * PPM },
            { x: 0 * PPM, y: 34.63 * PPM }
        ];

        // Souřadnice vnitřní stavitelné zóny (2m odstup)
        const innerPoints = [
            { x: 2 * PPM, y: 2 * PPM },
            { x: 14.58 * PPM, y: 2 * PPM },
            { x: 18 * PPM, y: 3.39 * PPM },
            { x: 18 * PPM, y: 32.63 * PPM },
            { x: 2 * PPM, y: 32.63 * PPM }
        ];

        // Vytvoření šrafovacího vzoru (červené linky)
        const hatchCanvas = document.createElement('canvas');
        hatchCanvas.width = 12;
        hatchCanvas.height = 12;
        const hctx = hatchCanvas.getContext('2d');
        hctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        hctx.lineWidth = 1.5;
        hctx.beginPath();
        hctx.moveTo(0, 12);
        hctx.lineTo(12, 0);
        hctx.stroke();

        const hatchPattern = new fabric.Pattern({
            source: hatchCanvas,
            repeat: 'repeat'
        });

        // 1. Vrstva: Šrafování (2m hranice)
        const outerHatch = new fabric.Polygon(outerPoints, {
            left: centerX, top: centerY,
            originX: 'center', originY: 'center',
            fill: hatchPattern, stroke: '#ef4444', strokeWidth: 1,
            selectable: false, evented: false
        });

        // 2. Vrstva: Stavební část (zelená tráva)
        const innerPlot = new fabric.Polygon(innerPoints, {
            left: centerX, top: centerY,
            originX: 'center', originY: 'center',
            fill: '#e2f0d9', stroke: '#7e9c65', strokeWidth: 1.5,
            selectable: false, evented: false
        });

        // Přidání textu s výměrou doprostřed
        const text = new fabric.Text("Pozemek 250/25\nRozloha: 680.6 m²\n(Šrafování = 2m hranice)", {
            left: centerX, top: centerY,
            fontSize: 15,
            fill: '#557041',
            textAlign: 'center',
            originX: 'center', originY: 'center',
            selectable: false, evented: false
        });

        canvas.add(outerHatch);
        canvas.add(innerPlot);
        canvas.add(text);
        
        canvas.sendToBack(text);
        canvas.sendToBack(innerPlot);
        canvas.sendToBack(outerHatch);
    }

    drawPlot();

    // --- 2. VLOŽENÍ DOMU ---
    function addHouse() {
        const houseWidth = 9.7 * PPM;
        const houseHeight = 7.9 * PPM;
        const elements = [];

        // Základová deska
        elements.push(new fabric.Rect({
            left: 0, top: 0, width: houseWidth, height: houseHeight,
            fill: '#ffffff', stroke: '#333333', strokeWidth: 3
        }));

        // Obývák + Kuchyně
        elements.push(new fabric.Rect({
            left: 5, top: 5, width: 85, height: 148,
            fill: '#fff0db', stroke: '#888', strokeWidth: 1
        }));
        elements.push(new fabric.Text("Obývák +\nKuchyně", {
            left: 47, top: 79, fontSize: 11, textAlign: 'center', originX: 'center', originY: 'center', fill: '#555'
        }));

        // Schodiště
        elements.push(new fabric.Rect({
            left: 95, top: 5, width: 35, height: 45,
            fill: '#e5e7eb', stroke: '#888', strokeWidth: 1
        }));
        for(let i=10; i<45; i+=5) {
            elements.push(new fabric.Line([95, i, 130, i], { stroke: '#9ca3af', strokeWidth: 1 }));
        }

        // Pokoj
        elements.push(new fabric.Rect({
            left: 135, top: 5, width: 54, height: 70,
            fill: '#fff0db', stroke: '#888', strokeWidth: 1
        }));
        elements.push(new fabric.Text("Pokoj", {
            left: 162, top: 40, fontSize: 11, textAlign: 'center', originX: 'center', originY: 'center', fill: '#555'
        }));

        // Koupelna
        elements.push(new fabric.Rect({
            left: 135, top: 80, width: 54, height: 35,
            fill: '#e0f2fe', stroke: '#888', strokeWidth: 1
        }));
        elements.push(new fabric.Text("Koupelna", {
            left: 162, top: 97, fontSize: 10, textAlign: 'center', originX: 'center', originY: 'center', fill: '#555'
        }));

        // Tech. místnost
        elements.push(new fabric.Rect({
            left: 135, top: 120, width: 54, height: 33,
            fill: '#f1f5f9', stroke: '#888', strokeWidth: 1
        }));
        elements.push(new fabric.Text("Tech.", {
            left: 162, top: 136, fontSize: 10, textAlign: 'center', originX: 'center', originY: 'center', fill: '#555'
        }));

        // Chodba
        elements.push(new fabric.Rect({
            left: 95, top: 55, width: 35, height: 98,
            fill: '#fafaf9', stroke: '#888', strokeWidth: 1
        }));
        
        // Vchodová šipka
        elements.push(new fabric.Triangle({
            left: 112, top: houseHeight + 10, width: 15, height: 15,
            fill: 'black', angle: 180, originX: 'center', originY: 'center'
        }));

        const houseGroup = new fabric.Group(elements, {
            left: canvas.width / 2, top: canvas.height / 2,
            originX: 'center', originY: 'center',
            lockScalingX: true, lockScalingY: true,
            hasBorders: true, hasControls: true
        });

        houseGroup.setControlsVisibility({
            mt: false, mb: false, ml: false, mr: false,
            tl: false, tr: false, bl: false, br: false,
            mtr: true 
        });

        canvas.add(houseGroup);
        canvas.setActiveObject(houseGroup);
    }

    // --- 3. KNIHOVNA OSTATNÍCH OBJEKTŮ ---
    function addShape(type) {
        let shape;

        // Vše uvnitř skupiny se renderuje od lokálního středu (0,0)
        const defaultOptions = {
            left: 0, top: 0, 
            originX: 'center', originY: 'center',
            opacity: 0.9,
            strokeWidth: 1
        };

        switch(type) {
            case 'carport': 
                shape = new fabric.Rect({ ...defaultOptions, width: 6 * PPM, height: 6 * PPM, fill: '#cbd5e1', stroke: '#475569' });
                break;
            case 'gardenHouse': 
                shape = new fabric.Rect({ ...defaultOptions, width: 5 * PPM, height: 3 * PPM, fill: '#d4a373', stroke: '#8b5a2b' });
                break;
            case 'terrace': 
                shape = new fabric.Rect({ ...defaultOptions, width: 6 * PPM, height: 4 * PPM, fill: '#fcd34d', stroke: '#b45309' });
                break;
            case 'driveway': 
                shape = new fabric.Rect({ ...defaultOptions, width: 5 * PPM, height: 3 * PPM, fill: '#d1d5db', stroke: '#9ca3af' });
                break;
            case 'pool': 
                shape = new fabric.Rect({ ...defaultOptions, width: 6 * PPM, height: 3 * PPM, fill: '#7dd3fc', stroke: '#0284c7', rx: 5, ry: 5 });
                break;
            case 'firepit': 
                shape = new fabric.Circle({ ...defaultOptions, radius: (1.5 * PPM) / 2, fill: '#fca5a5', stroke: '#dc2626' });
                break;
            case 'tree': 
                shape = new fabric.Circle({ ...defaultOptions, radius: (3 * PPM) / 2, fill: '#86efac', stroke: '#166534', opacity: 0.8 });
                break;
            case 'greenery': 
                shape = new fabric.Rect({ ...defaultOptions, width: 3 * PPM, height: 2 * PPM, fill: '#bbf7d0', stroke: '#22c55e', rx: 10, ry: 10 });
                break;
        }

        const textLabel = {
            'carport': 'Přístřešek\n(6x6m)',
            'gardenHouse': 'Zahr. domek\n(15m²)',
            'terrace': 'Terasa',
            'driveway': 'Cesta',
            'pool': 'Bazén',
            'firepit': 'Ohniště',
            'tree': 'Strom',
            'greenery': 'Zeleň'
        };

        const text = new fabric.Text(textLabel[type], {
            left: 0, top: 0, // Umístění do centra objektu
            fontSize: 12,
            fontFamily: 'sans-serif',
            fill: '#000',
            textAlign: 'center',
            originX: 'center', originY: 'center'
        });

        // Tady se teprve seskupený objekt vkládá na reálnou pozici na plátně
        const group = new fabric.Group([shape, text], {
            left: canvas.width / 2, top: canvas.height / 2,
            originX: 'center', originY: 'center',
            hasControls: true,
            transparentCorners: false
        });

        canvas.add(group);
        canvas.setActiveObject(group);
    }

    // --- 4. OVLÁDÁNÍ A MAZÁNÍ ---
    function deleteSelected() {
        const activeObject = canvas.getActiveObject();
        if (activeObject) {
            canvas.remove(activeObject);
            canvas.discardActiveObject();
        }
    }

    window.addEventListener('keydown', function(e) {
        if (e.key === 'Delete' || e.key === 'Backspace') {
            if (e.target.tagName !== 'INPUT') {
                deleteSelected();
                e.preventDefault();
            }
        }
    });

    canvas.on('mouse:down', function(options) {
        if(options.target && options.target.selectable) {
            options.target.bringToFront();
        }
    });

    // --- 5. EXPORT / IMPORT ---
    function exportJSON() {
        const json = canvas.toJSON();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(json));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", "navrh-pozemku.json");
        dlAnchorElem.click();
    }

    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(f) {
            const data = f.target.result;
            canvas.loadFromJSON(data, function() {
                canvas.renderAll();
                const objects = canvas.getObjects();
                // Ochrana vrstev pozemku (první 3 vrstvy)
                for(let i = 0; i < 3; i++) {
                    if(objects[i]) {
                        objects[i].set({selectable: false, evented: false});
                        canvas.sendToBack(objects[i]);
                    }
                }
            });
        };
        reader.readAsText(file);
    }

    // --- 6. EXPORT DO PDF ---
    function exportPDF() {
        canvas.discardActiveObject();
        canvas.renderAll();

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
            orientation: 'landscape',
            unit: 'px',
            format: [canvas.width, canvas.height]
        });

        const imgData = canvas.toDataURL({ format: 'jpeg', quality: 1.0 });
        doc.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
        doc.save('muj-navrh-pozemku.pdf');
    }

</script>
</body>
</html>
